<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHQ</title>
<style>
  :root{
    /* --- palette: swap this block to re-theme the whole app --- */
    --bg:#14171c; --panel:#1d2129; --panel-2:#242a34; --line:#39414e;
    --text:#eef0f3; --muted:#9aa4b2;
    --accent:#a9dcf5;            /* baby blue */
    --accent-ink:#08161f;        /* text on accent */
    --outline:#ffffff;           /* crisp outline on active things */
    --outline-dim:rgba(255,255,255,.42);
    --shadow-ink:#000000;
    /* status colors stay semantic — these signal food safety, not decoration */
    --fresh:#5fd08a; --soon:#f0a35e; --late:#e8646a; --cool:#6fb3e8; --plum:#b98ae0;
    --tap:56px; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
    /* kills double-tap zoom jitter WITHOUT killing pinch-zoom (a11y: WCAG 1.4.4).
       #draw sets touch-action:none, which is stricter and still wins on the canvas. */
    touch-action:manipulation}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;color:var(--text)}
  /* screen-reader-only: visible to assistive tech, not on screen.
     Used to give bare count badges spoken context ("Food, 3 items"). */
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  /* respect the OS "reduce motion" setting — vestibular disorders, and some
     neurodivergent users find movement actively distracting */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }

  #app{max-width:820px;margin:0 auto 0 96px;min-height:100%;display:flex;flex-direction:column;position:relative}
  header.top{position:absolute;top:4px;right:16px;z-index:5;text-align:right;pointer-events:none}
  header.top .now{font-variant-numeric:tabular-nums;line-height:1.1}
  header.top .now .t{display:block;font-size:30px;font-weight:800;letter-spacing:-.01em;
    color:var(--accent);text-shadow:0 2px 0 var(--shadow-ink)}
  header.top .now .d{display:block;font-size:13px;font-weight:700;color:var(--muted)}
  @media (max-width:400px){header.top .now .t{font-size:24px}header.top .now .d{font-size:11px}}
  main{flex:1;padding:6px 14px 40px}
  /* The clock is absolutely positioned, so it does not reserve space and nothing
     below it knows it is there. Two consequences had to be handled explicitly:
     (a) the first control row must stop SHORT of the clock rather than merely
         padding itself — with overflow-x:auto, padding lets chips scroll
         underneath it, which is what happened once Settings grew to ten panes;
     (b) a view with no control row at all (Shop) has nothing to offset, so main
         reserves the height instead. render() sets .nosub. */
  main > .subbar:first-child,main > div:first-child > .subbar:first-child{
    width:calc(100% - 150px);flex-wrap:wrap;overflow-x:visible}
  main.nosub{padding-top:56px}
  @media (max-width:400px){
    main > .subbar:first-child,main > div:first-child > .subbar:first-child{width:calc(100% - 120px)}
    main.nosub{padding-top:46px}
  }
  .needs{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;
    font-size:11px;font-weight:700;background:var(--panel-2);color:var(--muted);
    border:1px solid var(--line);vertical-align:middle}
  .btable{display:flex;flex-direction:column;gap:8px}
  .brow{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
  .brow>b{display:block;margin-bottom:5px}
  .bchips{display:flex;flex-wrap:wrap;gap:5px}
  .chip.sm{min-height:0;padding:2px 9px;font-size:12px;font-weight:600}
  .chip.sm.new{border-style:dashed}
  .chip.sm.gap{opacity:.75;font-style:italic}

  nav.tabs{position:fixed;left:0;top:0;bottom:0;z-index:20;width:88px;
    background:var(--panel);border-right:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 8px 10px}
  nav.tabs .row{height:100%;display:flex;flex-direction:column;gap:8px;
    background:none;border:none;padding:0}
  nav.tabs button{min-height:74px;border-radius:12px;font-weight:700;font-size:12px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
    border:2px solid transparent}
  nav.tabs .ico{font-size:28px;line-height:1.1;filter:grayscale(.45) opacity(.75)}
  nav.tabs button.on{background:var(--panel-2);color:var(--text);
    border-color:var(--outline);box-shadow:0 0 0 3px var(--shadow-ink), 0 0 0 4px var(--accent)}
  nav.tabs button.on .ico{filter:none}
  nav.tabs .n{position:absolute;top:4px;right:6px;min-width:20px;padding:0 5px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;
    font-variant-numeric:tabular-nums;border:1px solid var(--shadow-ink)}
  nav.tabs .n.alert{background:var(--late);color:#fff}
  nav.tabs .n:empty,nav.tabs .n.zero{display:none}
  @media (max-width:400px){nav.tabs{width:72px}nav.tabs .ico{font-size:24px}nav.tabs button{font-size:11px;min-height:64px}}

  .micro{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .btn{min-height:var(--tap);padding:10px 18px;border-radius:12px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--outline)}
  .btn.danger{color:var(--late);border-color:#7f4f59}
  .btn.ghost{background:none}
  .btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;
    background:var(--panel-2);border:1px solid var(--line)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--outline);
    box-shadow:0 0 0 2px var(--shadow-ink)}
  .chip.big{min-height:var(--tap);font-size:17px;padding:10px 20px}
  .field{width:100%;min-height:var(--tap);padding:12px 14px;border-radius:12px;
    background:var(--panel-2);border:1px solid var(--line)}
  textarea.field{min-height:90px;resize:vertical}
  .stack{display:flex;flex-direction:column;gap:10px}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty strong{color:var(--text)}
  .subbar{display:flex;gap:8px;padding:6px 4px 12px;overflow-x:auto}
  section.block{padding:16px;margin-top:14px}
  section.block h3{font-size:16px;font-weight:800;margin-bottom:10px}
  .rowsplit{display:flex;gap:10px;flex-wrap:wrap}
  .rowsplit>*{flex:1;min-width:150px}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow .field{flex:1}

  .itemcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:72px}
  .itemcard + .itemcard{margin-top:8px}
  .days{flex:0 0 62px;height:62px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
    background:var(--panel-2);border:1px solid var(--line)}
  .days b{font-size:22px;font-weight:800;line-height:1}
  .days span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:3px}
  .days.fresh{border-color:var(--fresh)} .days.fresh b{color:var(--fresh)}
  .days.soon{border-color:var(--soon)}  .days.soon b{color:var(--soon)}
  .days.late{border-color:var(--late);background:#3b313a}
  .days.late b{color:var(--late)}
  .days.none b{color:var(--muted);font-size:18px}
  .iteminfo{flex:1;min-width:0}
  .iteminfo .nm{font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iteminfo .meta{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grouphead{padding:18px 6px 8px}
  .flags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .flag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px}
  .flag.pri{background:rgba(232,100,106,.20);color:var(--late)}
  .flag.help{background:rgba(111,179,232,.20);color:var(--cool)}
  .flag.who{background:var(--panel-2);color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .grid .chip{justify-content:center;display:flex;align-items:center;min-height:var(--tap)}
  .suggest{color:var(--muted);font-size:14px;margin-top:8px}
  .suggest .tag{color:var(--accent)}

  .rev{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase}
  .rev.usda{background:rgba(95,208,138,.18);color:var(--fresh)}
  .rev.owner{background:rgba(169,220,245,.18);color:var(--accent)}
  .rev.unrev{background:rgba(154,164,178,.18);color:var(--muted)}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:820px;max-height:88vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .sheet .sub{color:var(--muted);margin-top:2px}
  .guide{margin-top:14px;padding:14px;background:var(--panel-2);border-radius:12px}
  .guide dt{margin-top:10px} .guide dt:first-child{margin-top:0} .guide dd{margin-top:3px}
  .guide .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sheet .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .sheet .actions .btn{flex:1;min-width:140px}
  dialog.confirm{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);
    padding:22px;max-width:420px;width:90%}
  dialog.confirm::backdrop{background:rgba(0,0,0,.55)}
  dialog.confirm p{margin-bottom:16px}
  dialog.confirm .actions{display:flex;gap:10px}
  dialog.confirm .actions .btn{flex:1}

  .shoprow,.listrow{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:var(--tap)}
  .shoprow + .shoprow,.listrow + .listrow{border-top:1px solid var(--line)}
  .shoprow .tick{flex:0 0 40px;height:40px;border-radius:10px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
  .shoprow.done .tick{background:var(--fresh);border-color:var(--fresh);color:#0c2416}
  .shoprow.done .nm{text-decoration:line-through;color:var(--muted)}
  .shoprow .nm,.listrow .nm{flex:1;text-align:left;font-weight:600}
  .listrow .cnt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

  .streak{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:var(--tap)}
  .streak + .streak{border-top:1px solid var(--line)}
  .streak .nm{flex:1;font-weight:600}
  .streak .flame{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
  .streak .best{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px}
  .legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
  .kv + .kv{border-top:1px solid var(--line)}
  .report{background:var(--panel-2);border-radius:12px;padding:12px;margin-top:12px;font-size:15px;max-height:260px;overflow:auto}
  .report .bad{color:var(--late)} .report .good{color:var(--fresh)}
  .report ul{margin:8px 0 0 18px}

  /* ---------- notes board ---------- */
  .note{padding:12px 14px;margin-top:10px}
  .note .head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:8px}
  .note .head b{color:var(--text)}
  .note .head .x{margin-left:auto}
  .note p.body{white-space:pre-wrap;font-size:18px}
  .note img{max-width:100%;border-radius:10px;display:block;background:var(--panel-2)}
  .note audio{width:100%;margin-top:2px}
  .note .part + .part{margin-top:10px}
  .partlist{margin:10px 0 0}
  .partrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-2);
    border-radius:10px;margin-top:6px}
  .partrow .ic{font-size:20px}
  .partrow .nm{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toolrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .composer .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .composer .modes .chip{justify-content:center;display:flex;min-height:var(--tap)}
  #drawWrap{position:relative;margin-top:10px}
  #draw{width:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;display:block;background:#20252e}
  .inkrow{display:flex;gap:8px;margin-top:10px;align-items:center}
  .ink{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
  .ink.on{border-color:var(--outline);box-shadow:0 0 0 2px var(--shadow-ink)}
  .rec{display:flex;align-items:center;gap:12px;margin-top:10px}
  .rec .dot{width:14px;height:14px;border-radius:50%;background:var(--late);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
  .face{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block;
    border:2px solid var(--line);background:var(--panel-2)}
  .face.sm{width:26px;height:26px;display:inline-block;vertical-align:middle;margin-right:6px}
  .face.lg{width:64px;height:64px}
  .chip.on .face{border-color:var(--accent-ink)}
  .chip.hasface{padding:5px 10px}
  /* prizes */
  .prize{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:var(--tap)}
  .prize + .prize{border-top:1px solid var(--line)}
  .prize .lock{font-size:26px;width:34px;text-align:center}
  .prize .nm{flex:1}
  .prize .nm b{display:block}
  .prize .nm span{color:var(--muted);font-size:14px}
  .prize.open{background:rgba(169,220,245,.10)}
  .goal{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:14px;
    border:2px dashed #7696aa;border-radius:var(--radius)}
  .goal .big{font-size:30px}
  .goal .txt{flex:1}
  .goal .txt b{display:block;font-size:17px}
  .goal .txt span{color:var(--muted);font-size:14px}
  /* shopping, tighter */
  .storehead{display:flex;align-items:baseline;gap:8px;padding:14px 6px 6px}
  .shoprow{display:flex;align-items:center;gap:10px;padding:3px 12px;min-height:46px}
  .shoprow .tick{flex:0 0 34px;height:34px;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .shoprow .mv{color:var(--muted);font-size:13px;padding:4px 8px;min-height:34px}
  /* --- fallback for browsers without flexbox gap (pre-2020); .no-flexgap set at boot --- */
  .no-flexgap .chiprow,.no-flexgap .subbar,.no-flexgap .toolrow,.no-flexgap .inkrow,
  .no-flexgap .legend,.no-flexgap .actions,.no-flexgap .rowsplit{margin-left:-4px;margin-right:-4px}
  .no-flexgap .chiprow>*,.no-flexgap .subbar>*,.no-flexgap .toolrow>*,.no-flexgap .inkrow>*,
  .no-flexgap .legend>*,.no-flexgap .actions>*,.no-flexgap .rowsplit>*{margin:4px}
  .no-flexgap .stack>*+*{margin-top:10px}
  .no-flexgap nav.tabs .row>*+*{margin-top:8px}
  .no-flexgap .addrow>*+*{margin-left:8px}
  .no-flexgap .itemcard>*+*,.no-flexgap .listrow>*+*,.no-flexgap .shoprow>*+*,
  .no-flexgap .streak>*+*,.no-flexgap .prize>*+*,.no-flexgap .partrow>*+*,
  .no-flexgap .note .head>*+*,.no-flexgap .rec>*+*,.no-flexgap .goal>*+*{margin-left:10px}
  .no-flexgap .storehead>*+*{margin-left:8px}
  .toast{position:fixed;left:calc(50% + 44px);bottom:24px;transform:translateX(-50%);z-index:40;
    background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 18px;
    font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(90% - 88px);text-align:center}
  .toast.show{opacity:1}
  @media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <span class="now" id="clock"><span class="t"></span><span class="d"></span></span>
  </header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Main sections"><div class="row">
    <button data-tab="food" class="on"><span class="ico" aria-hidden="true">🥘</span>Food<span class="n" id="nFood" aria-hidden="true">0</span><span class="sr" id="nFoodSR"></span></button>
    <button data-tab="chores"><span class="ico" aria-hidden="true">🪴</span>Chores<span class="n" id="nChores" aria-hidden="true">0</span><span class="sr" id="nChoresSR"></span></button>
    <button data-tab="habits"><span class="ico" aria-hidden="true">📈</span>Habits</button>
    <button data-tab="shop"><span class="ico" aria-hidden="true">💰</span>Shop<span class="n" id="nShop" aria-hidden="true">0</span><span class="sr" id="nShopSR"></span></button>
    <button data-tab="notes"><span class="ico" aria-hidden="true">💬</span>Notes<span class="n" id="nNotes" aria-hidden="true">0</span><span class="sr" id="nNotesSR"></span></button>
    <button data-tab="settings"><span class="ico" aria-hidden="true">⚙️</span>Setup</button>
  </div></nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
/* =====================================================================
   ADHQ — offline family board
   Phase 1: food + shopping + categories
   Phase 2: chores + habits + members + CSV in/out + storage readout
   No network requests. All data in IndexedDB on this device.
   ===================================================================== */

/* ---------- embedded food library (stub tier) ---------- */
const LIBRARY = [
 {id:'milk-opened',tags:['dairy','fresh'],name:'Milk',aliases:['whole milk','2% milk','skim milk'],category:'Dairy',state:'opened',
  best:'Fridge shelf',ok:['Fridge door'],cont:'Original packaging',fridge:[5,7],freezer:[90,90],pantry:'NR',
  signs:['sour smell','curdled texture','yellowing'],tips:'Keep on a shelf, not the door — door temps swing the most.',
  review:'usda',signsReview:'unrev',source:'USDA FoodKeeper'},
 {id:'eggs',tags:['eggs','fresh'],name:'Eggs',aliases:['egg'],category:'Dairy',state:'raw in shell',
  best:'Fridge shelf',ok:[],cont:'Original packaging',fridge:[21,35],pantry:'NR',
  signs:['sulfur smell when cracked','floats in water'],tips:'Store in the carton on a shelf; the carton slows moisture loss.',
  review:'usda',signsReview:'unrev',source:'USDA FoodKeeper'},
 {id:'chicken-raw',tags:['meat','poultry','fresh'],name:'Chicken (raw)',aliases:['raw chicken','chicken breast','chicken thighs'],category:'Protein',state:'raw',
  best:'Fridge shelf',ok:['Freezer'],cont:'Sealed container',fridge:[1,2],freezer:[270,365],pantry:'NR',
  signs:['gray or green tint','slimy film','sour smell'],tips:'Bottom shelf, in a container — drips contaminate everything below.',
  review:'usda',signsReview:'unrev',source:'USDA FoodKeeper'},
 {id:'chicken-cooked',tags:['meat','poultry','prepared','leftovers'],name:'Chicken (cooked)',aliases:['cooked chicken','rotisserie chicken','leftover chicken'],category:'Leftovers',state:'cooked',
  best:'Fridge shelf',ok:['Freezer'],cont:'Sealed container',fridge:[3,4],freezer:[60,180],pantry:'NR',
  signs:['off smell','slimy surface','mold'],tips:'Refrigerate within 2 hours of cooking.',
  review:'usda',signsReview:'unrev',source:'USDA FoodKeeper'},
 {id:'beef-ground-raw',tags:['meat','fresh'],name:'Ground beef (raw)',aliases:['ground beef','hamburger meat','mince'],category:'Protein',state:'raw',
  best:'Fridge shelf',ok:['Freezer'],cont:'Original packaging',fridge:[1,2],freezer:[90,120],pantry:'NR',
  signs:['brown-gray throughout','sour smell','sticky texture'],tips:'Bottom shelf. Surface browning alone is oxidation, not spoilage.',
  review:'usda',signsReview:'unrev',source:'USDA FoodKeeper'},
 {id:'fish-raw',tags:['seafood','fish','fresh'],name:'Fish (raw)',aliases:['salmon','white fish','fillet'],category:'Protein',state:'raw',

/* ---------- IndexedDB ---------- */
const STORES=['items','categories','shopping','common','members','chores','choreTypes','choreHistory','habits','habitLogs','messages','stores','prizes'];
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const rq=indexedDB.open('adhq',6);
    rq.onupgradeneeded=e=>{
      const d=e.target.result;
      for(const s of STORES) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('library')) d.createObjectStore('library',{keyPath:'fid'});
      if(!d.objectStoreNames.contains('libmeta')) d.createObjectStore('libmeta',{keyPath:'kind'});
      /* v6: sync bookkeeping — session, cursor, tombstones. Outside STORES,
         like library/libmeta, so "Erase all data" and CSV backup ignore it. */
      if(!d.objectStoreNames.contains('sync')) d.createObjectStore('sync',{keyPath:'k'});
    };
    rq.onsuccess=e=>{db=e.target.result;res()};
    rq.onerror=()=>rej(rq.error);
  });
}
function tx(store,mode,fn){
  return new Promise((res,rej)=>{
    const t=db.transaction(store,mode),s=t.objectStore(store);
    const out=fn(s);
    t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
    t.onerror=()=>rej(t.error);
  });
}
const getAll=s=>tx(s,'readonly',st=>st.getAll()).then(r=>r??[]);
const getOne=(s,k)=>tx(s,'readonly',st=>st.get(k));
/* raw writes — used by the sync engine when applying remote changes, so that
   pulling a record doesn't immediately mark it dirty and push it straight back */
const rawPut=(s,v)=>tx(s,'readwrite',st=>st.put(v));
const rawDel=(s,k)=>tx(s,'readwrite',st=>st.delete(k));
const clearStore=s=>tx(s,'readwrite',st=>st.clear());
const uuid=()=>(globalThis.crypto?.randomUUID?crypto.randomUUID()
  :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16)}));

/* Every app write goes through these two. In the Local edition they are the
   original one-liners. In the Connected edition they additionally stamp a
   device-independent `uid`, a `modified` clock, and a dirty flag — and record
   a tombstone on delete, because without one a delete here is simply undone
   by the next pull from another device. */
async function put(s,v){
  if(syncable(s)){ v.uid??=uuid(); v.modified=Date.now(); v._dirty=1; syncSoon(); }
  return rawPut(s,v);
}
async function del(s,k){
  if(syncable(s)){
    const rec=await getOne(s,k);
    if(rec?.uid){ await rawPut('sync',{k:`tomb:${s}:${rec.uid}`,store:s,uid:rec.uid,at:Date.now(),_dirty:1}); syncSoon(); }
  }
  return rawDel(s,k);
}

async function loadAll(){
  const got=await Promise.all(STORES.map(getAll));
  STORES.forEach((s,i)=>D[s]=got[i]);
  const seed=async(store,names)=>{ if(D[store].length===0){ for(const name of names) await put(store,{name}); D[store]=await getAll(store);} };
  await seed('categories',DEFAULT_CATS);
  await seed('common',DEFAULT_COMMON);
  await seed('choreTypes',DEFAULT_CHORE_TYPES);
  await seed('habits',DEFAULT_HABITS);
  await seed('stores',DEFAULT_STORES);
  await migrateStorage();
  await migrateUids();
  await refreshLib();
}
/* one-time per store: records created before sync was switched on have no `uid`.
   The integer `id` stays as the IndexedDB key — 2,000 lines of app code reference
   it — but it is device-local and collides across devices, so it can never be the
   sync key. `uid` is. Backfilled records are marked dirty so the first sync
   uploads them rather than silently leaving them behind. */
async function migrateUids(){
  if(!SYNC.enabled) return;
  for(const s of SYNC.stores){
    const missing=(D[s]||[]).filter(r=>!r.uid);
    if(!missing.length) continue;
    for(const r of missing){ r.uid=uuid(); r.modified??=r.created??Date.now(); r._dirty=1; await rawPut(s,r); }
    await reload(s);
  }
}
/* one-time: the old model had a single `method` mixing places and containers */
async function migrateStorage(){
  const OLD_CONT={'Sealed container':'Sealed container','Original packaging':'Original packaging'};
  const OLD_LOC={'Fridge shelf':'Fridge shelf','Crisper drawer':'Crisper drawer','Door':'Fridge door','Freezer':'Freezer'};
  let touched=false;
  for(const it of D.items){
    if(it.method===undefined) continue;
    if(OLD_LOC[it.method]) it.location??=OLD_LOC[it.method];
    else if(OLD_CONT[it.method]) it.container??=OLD_CONT[it.method];
    delete it.method; touched=true;
    await put('items',it);
  }
  if(touched) await reload('items');
}
const reload=async(...s)=>{ for(const k of s) D[k]=await getAll(k); };

async function refreshLib(){

const libById=id=>id?LIB.find(e=>e.id===id)||null:null;
function libFor(item){ return libById(item.libId)||libMatch(item.name); }
function preferOpened(list){
  if(list.length<2) return list[0]||null;
  /* same name, multiple states: prefer the opened variant — its keep times are the
     conservative ones, and a logged item is more often open than factory-sealed */
  return list.find(e=>/(^|\W)opened/.test(e.state||'')&&!/unopened/.test(e.state||''))||list[0];
}
function libMatch(name){
  const q=(name||'').trim().toLowerCase(); if(!q) return null;
  const exact=LIB.filter(e=>e.name.toLowerCase()===q);
  if(exact.length) return preferOpened(exact);
  const alias=LIB.filter(e=>e.aliases.some(a=>a.toLowerCase()===q));
  if(alias.length) return preferOpened(alias);
  return LIB.find(e=>q.includes(e.name.toLowerCase().split(' (')[0])&&e.name.length>3)
      || LIB.find(e=>e.aliases.some(a=>q.includes(a.toLowerCase())&&a.length>3))
      || null;
}

}

/* ---------- dates ---------- */
const DAY=86400000;
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const todayISO=()=>{const d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
const isoPlus=n=>{const d=new Date(Date.now()+n*DAY);d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
function daysUntil(iso){
  if(!iso) return null;
  const t=new Date();t.setHours(0,0,0,0);
  const e=new Date(iso+'T00:00:00');
  return Math.round((e-t)/DAY);
}
const daysLeft=it=>daysUntil(it.eatBy);
function dayClass(d){ if(d===null)return'none'; if(d<0)return'late'; if(d<=2)return'soon'; return'fresh'; }
function dayChip(d){
  const cls=dayClass(d);
  const big=d===null?'—':(d<0?Math.abs(d)+'d':d+'d');
  const lab=d===null?'no date':(d<0?'over':(d===0?'today':'left'));
  return `<span class="days ${cls}"><b>${big}</b><span>${lab}</span></span>`;
}
function advance(iso,rec,interval,from){
  const base=new Date((from||iso)+'T12:00:00');
  if(rec==='daily') base.setDate(base.getDate()+1);
  else if(rec==='weekly') base.setDate(base.getDate()+7);
  else if(rec==='monthly'){
    /* clamp instead of overflowing: Jan 31 + 1 month = Feb 28, not Mar 3 */
    const day=base.getDate();
    base.setDate(1); base.setMonth(base.getMonth()+1);
    const lastDay=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
    base.setDate(Math.min(day,lastDay));
  }
  else if(rec==='custom') base.setDate(base.getDate()+(interval||1));
  return base.toISOString().slice(0,10);
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1900)}
const mediaURLs=new Map();
const bytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';

/* ---------- member avatars (shared: habits, chores, notes, prizes) ---------- */
function avatarURL(m){
  if(!m?.avatar) return null;
  const k='avatar:'+m.id;
  if(!mediaURLs.has(k)) mediaURLs.set(k,URL.createObjectURL(m.avatar));
  return mediaURLs.get(k);
}

/* compact=true -> the picture stands in for the name (filters); else picture + name */
function memberFace(name,compact){
  const m=memberByName(name), u=avatarURL(m);
  if(!u) return esc(name);
  return compact
    ? `<img class="face" src="${u}" alt="${esc(name)}" title="${esc(name)}">`
    : `<img class="face sm" src="${u}" alt=""> ${esc(name)}`;
}

/* ===================== BATCH ADD =====================
   Walking round the house saying "sheets need washing every two weeks, that's
   linen maintenance". One line per thing. Only the name is required.

   Tokens after the name are CLASSIFIED, not positional — you can say them in any
   order, and anything the app doesn't recognise is surfaced rather than dropped.
   An unrecognised word is usually a category or chore type that doesn't exist
   yet, so it's offered as one to create.
   ==================================================== */
const batchTokens=line=>line.split(/[,;]|\s+[–—-]\s+/).map(t=>t.trim()).filter(Boolean);
const ciFind=(list,tok)=>list.find(x=>(x.name||x).toLowerCase()===tok.toLowerCase());

/* "+5", "in 3 days", "2 weeks", "2026-08-20" -> YYYY-MM-DD, else null */
function batchDate(tok){
  const s=tok.trim().toLowerCase();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(?:\+|in\s+)?(\d+)\s*(d|day|days|w|week|weeks)$/);
  if(!m) return null;
  return isoPlus(+m[1]*(/^w/.test(m[2])?7:1));
}
/* "every two weeks", "fortnightly", "weekly", "every 3 days" -> {recurrence,interval} */
const NUMWORD={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function batchRecur(tok){
  const s=tok.trim().toLowerCase();
  if(/^(daily|every ?day)$/.test(s)) return {recurrence:'daily',interval:1};
  if(/^(weekly|every ?week)$/.test(s)) return {recurrence:'weekly',interval:7};
  if(/^(monthly|every ?month)$/.test(s)) return {recurrence:'monthly',interval:30};
  if(/^(fortnightly|biweekly|every ?other ?week)$/.test(s)) return {recurrence:'custom',interval:14};
  if(/^every ?other ?day$/.test(s)) return {recurrence:'custom',interval:2};
  const m=s.match(/^every\s+(\d+|[a-z]+)\s*(d|day|days|w|week|weeks|m|month|months)$/);
  if(!m) return null;
  const n=/^\d+$/.test(m[1])?+m[1]:NUMWORD[m[1]];
  if(!n) return null;
  if(/^m/.test(m[2])) return n===1?{recurrence:'monthly',interval:30}:{recurrence:'custom',interval:n*30};
  if(/^w/.test(m[2])) return n===1?{recurrence:'weekly',interval:7}:{recurrence:'custom',interval:n*7};
  return n===1?{recurrence:'daily',interval:1}:{recurrence:'custom',interval:n};
}
function batchLocation(tok){
  const hit=ciFind(LOCATIONS,tok); if(hit) return hit.name;
  const s=tok.toLowerCase();
  if(/^fridge$/.test(s)) return 'Fridge shelf';
  if(/^(crisper|veg drawer)$/.test(s)) return 'Crisper drawer';
  if(/^door$/.test(s)) return 'Fridge door';
  return LOCATIONS.find(l=>l.name.toLowerCase().includes(s)&&s.length>3)?.name||null;
}

function batchParse(kind,text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const toks=batchTokens(line);
    const name=toks.shift();
    const r={line,name,unknown:[]};
    for(const t of toks){
      if(kind==='food'){
        const loc=batchLocation(t);       if(loc&&!r.location){r.location=loc;continue}
        const cat=ciFind(D.categories,t); if(cat&&!r.category){r.category=cat.name;continue}
        const con=ciFind(CONTAINERS,t);   if(con&&!r.container){r.container=con;continue}
        const d=batchDate(t);             if(d&&!r.eatBy){r.eatBy=d;continue}
      }else{
        const rec=batchRecur(t);          if(rec&&!r.recurrence){Object.assign(r,rec);continue}
        const who=ciFind(D.members,t);    if(who){(r.assignees??=[]).push(who.name);continue}
        const ty=ciFind(D.choreTypes,t);  if(ty&&!r.type){r.type=ty.name;continue}
        const d=batchDate(t);             if(d&&!r.dueBy){r.dueBy=d;continue}
        if(/^(priority|urgent)$/i.test(t)){r.priority=true;continue}
      }
      r.unknown.push(t);
    }
    /* the first unrecognised word is almost always a category / chore type that
       doesn't exist yet — propose it rather than discarding it */
    if(r.unknown.length) r.propose=r.unknown[0];
    /* food has nowhere to keep loose words; chores have a notes field, so use it */
    if(kind==='chores'&&r.unknown.length>1) r.notes=r.unknown.slice(1).join(', ');
    return r;
  });
}
const batchGaps=(kind,r)=>kind==='food'
  ? ['category','location','eat-by'].filter((_,i)=>![r.category,r.location,r.eatBy][i])
  : ['type','repeat','due date','who'].filter((_,i)=>![r.type,r.recurrence,r.dueBy,r.assignees?.length][i]);

function batchNewVocab(){
  if(!batch.parsed) return [];
  const known=batch.kind==='food'?D.categories:D.choreTypes;
  const seen=new Set(known.map(x=>x.name.toLowerCase()));
  const out=[];
  for(const r of batch.parsed){
    if(!r.propose) continue;
    const k=r.propose.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(r.propose);
  }
  return out;
}
window.batchCommit=async()=>{
  const kind=batch.kind, rows=batch.parsed, fresh=batchNewVocab();
  const store=kind==='food'?'categories':'choreTypes';
  const cap=kind==='food'?CAP.cats:CAP.choreTypes;
  let made=0;
  if(batch.makeVocab){
    for(const name of fresh){
      if(D[store].length+made>=cap) break;      /* caps are caps */
      await put(store,{name}); made++;
    }
    await reload(store);
  }
  const live=new Set(D[store].map(x=>x.name.toLowerCase()));
  const now=Date.now();
  for(const r of rows){
    const proposed=r.propose&&live.has(r.propose.toLowerCase())?
      D[store].find(x=>x.name.toLowerCase()===r.propose.toLowerCase()).name:null;
    if(kind==='food'){
      await put('items',{name:r.name,location:r.location||null,container:r.container||null,
        category:r.category||proposed||null,libId:null,eatBy:r.eatBy||null,created:now,modified:now});
    }else{
      await put('chores',{title:r.name,type:r.type||proposed||null,
        recurrence:r.recurrence||'none',interval:r.interval||7,checkIn:'',dueBy:r.dueBy||'',
        assignees:r.assignees||[],priority:!!r.priority,needsHelp:false,
        notes:r.notes||'',created:now,modified:now});
    }
  }
  await reload(kind==='food'?'items':'chores');
  const gapped=rows.filter(r=>batchGaps(kind,{...r,...(r.propose&&batch.makeVocab?{[kind==='food'?'category':'type']:r.propose}:{})}).length).length;
  batch=null; foodSub='list';
  toast(`Added ${rows.length}${made?` · ${made} new ${kind==='food'?'categories':'types'}`:''}${gapped?` · ${gapped} need details`:''}`);
  render();
};

  const rows=batch.parsed.map(r=>{
    const bits=food
      ? [r.category,r.location,r.container,r.eatBy?'eat by '+r.eatBy:null]

    return `<div class="brow"><b>${esc(r.name)}</b><div class="bchips">${known}${prop}${note}${miss}</div></div>`;
  }).join('');
  const vocab=fresh.length?`<section class="block card"><h3>${fresh.length} new ${food?'category':'chore type'}${fresh.length===1?'':'s'}</h3>
      <p class="suggest">These are not in your list yet: <b>${fresh.map(esc).join(', ')}</b>.</p>
      <div class="chiprow">
        <button class="chip ${batch.makeVocab?'on':''}" onclick="batchToggleVocab()">Create ${fresh.length===1?'it':'them'} and assign</button>
        <button class="chip ${batch.makeVocab?'':'on'}" onclick="batchToggleVocab()">Leave blank and flag</button></div></section>`:'';
  const gapCount=batch.parsed.filter(r=>batchGaps(kind,{...r,...(r.propose&&batch.makeVocab?{[food?'category':'type']:r.propose}:{})}).length).length;
  return back+vocab+`<section class="block card"><h3>${batch.parsed.length} to add</h3>
      ${gapCount?`<p class="suggest">${gapCount} still ${gapCount===1?'has':'have'} blanks. That is fine —
        they are added anyway and show a <b>needs details</b> tag you can filter for later.</p>`:''}

      <div class="actions" style="margin-top:12px">
        <button class="btn" onclick="batchCommit()">Add ${batch.parsed.length}</button>
        <button class="btn ghost" onclick="batchBack()">Edit the list</button></div></section>`;

/* ===================== HABITS ===================== */
const dayKey=ts=>{const d=new Date(ts);d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
function last7(){const out=[];for(let i=6;i>=0;i--)out.push(dayKey(Date.now()-i*DAY));return out}
function streakFor(member,habit){
  const days=new Set(D.habitLogs.filter(l=>l.member===member&&l.habit===habit).map(l=>l.day));
  let n=0,cur=new Date();cur.setHours(12,0,0,0);
  if(!days.has(cur.toISOString().slice(0,10))) cur.setDate(cur.getDate()-1); /* today not logged yet is ok */
  while(days.has(cur.toISOString().slice(0,10))){n++;cur.setDate(cur.getDate()-1)}
  return n;
}
function habitDays(member,habit){
  return [...new Set(D.habitLogs.filter(l=>l.member===member&&l.habit===habit).map(l=>l.day))].sort();
}
/* maximal consecutive-day runs, so back-dated entries join runs automatically */
function runsOf(days){
  const runs=[]; let run=0,prev=null;
  for(const d of days){
    const gap=prev?Math.round((new Date(d+'T12:00:00')-new Date(prev+'T12:00:00'))/DAY):null;
    run=(gap===1)?run+1:1;
    if(gap===1) runs[runs.length-1]=run; else runs.push(1);
    prev=d;
  }
  return runs;
}
/* every completed STREAK_GOAL inside any run earns one prize — derived from the logs,
   so editing history re-counts honestly instead of trusting a stored tally */
function bestStreak(member,habit){
  const runs=runsOf(habitDays(member,habit));
  return runs.length?Math.max(...runs):0;
}
function milestonesFor(member){
  const habits=[...new Set(D.habitLogs.filter(l=>l.member===member).map(l=>l.habit))];
  return habits.reduce((sum,hb)=>sum+runsOf(habitDays(member,hb)).reduce((s,r)=>s+Math.floor(r/STREAK_GOAL),0),0);
}
const prizesFor=member=>D.prizes.filter(p=>p.to===member).sort((a,b)=>a.created-b.created);
function prizeStatus(member){
  const q=prizesFor(member), earned=milestonesFor(member);
  const claimed=q.filter((p,i)=>i<earned);
  return {queue:q,earned,unlocked:claimed.length,locked:q.length-claimed.length};
}
function viewHabits(){
  if(D.members.length===0) return `<div class="empty card"><p><strong>No household names yet.</strong></p>
    <p>Add names in <b>Setup</b> — habits are logged per person.</p></div>`;

  const day=habitDate||dayKey(Date.now());

  const names=`<div class="subbar">${D.members.map(m=>
    `<button class="chip big ${who===m.name?'on':''} ${m.avatar?'hasface':''}" onclick="setWho(${q(m.name)})">${memberFace(m.name,true)}</button>`).join('')}</div>`;
  const dayLabel=isToday?'today':(day===dayKey(Date.now()-DAY)?'yesterday'
    :new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}));
  const dates=`<div class="subbar">
    <button class="chip ${isToday?'on':''}" onclick="setHabitDate(0)">Today</button>

      max="${dayKey(Date.now())}" onchange="setHabitDay(this.value)">
  </div>`;
  const grid=`<section class="block card"><h3>Tap what ${esc(who)} did ${esc(dayLabel)}</h3>
    ${dates}
    <div class="grid">${D.habits.map(hb=>
      `<button class="chip ${logged(hb.name)?'on':''}" onclick="logHabit(${q(hb.name)})">${esc(hb.name)}${logged(hb.name)?' ✓':''}</button>`).join('')}</div>
    <p class="suggest">Tapping a checked habit removes that day's entry. Pick any past date to fill in or fix history.</p></section>`;
  const streaks=`<section class="block card"><h3>${esc(who)}'s streaks</h3>
    <div style="margin:0 -16px">${D.habits.map(hb=>{
      const s=streakFor(who,hb.name), best=bestStreak(who,hb.name);
      const toGo=s>0?STREAK_GOAL-(s%STREAK_GOAL||STREAK_GOAL):STREAK_GOAL;
      return `<div class="streak"><span class="nm">${esc(hb.name)}</span>
        <span class="best">${s>0&&toGo<STREAK_GOAL?toGo+' to a prize':''}</span>
        <span class="flame">${s?s+'d 🔥':'—'}</span><span class="best">best ${best}d</span></div>`;
    }).join('')}</div>${goalBanner(who)}</section>`;
  return names+grid+streaks+graphBlock();
}
function goalBanner(who){
  const st=prizeStatus(who);
  if(st.unlocked>0) return `<div class="goal">
    <span class="big">🎁</span><span class="txt"><b>${st.unlocked} prize${st.unlocked===1?'':'s'} unlocked for ${esc(who)}!</b>
    <span>Earned by keeping a ${STREAK_GOAL}-day streak. Tap to open.</span></span>
    <button class="btn primary" onclick="openPrize(${q(who)})">Open</button></div>`;
  if(st.locked>0){
    const best=Math.max(0,...D.habits.map(hb=>streakFor(who,hb.name)));
    const toGo=best>0?STREAK_GOAL-(best%STREAK_GOAL||STREAK_GOAL):STREAK_GOAL;
    return `<div class="goal"><span class="big">🎁</span><span class="txt">
      <b>${st.locked} prize${st.locked===1?'':'s'} waiting for ${esc(who)}</b>
      <span>${best>0?`${toGo} more day${toGo===1?'':'s'} in a row on any habit unlocks the next one.`
        :`Keep any habit going ${STREAK_GOAL} days in a row to unlock one.`}</span></span></div>`;
  }
  return `<div class="goal"><span class="big">🔥</span><span class="txt">
    <b>${STREAK_GOAL} days in a row earns a prize</b>
    <span>Someone in the house can set one up in Setup → Prizes.</span></span></div>`;
}

  if(existing){ await del('habitLogs',existing.id); toast(`Removed ${name} for ${day===dayKey(Date.now())?'today':day}`); }

  await reload('habitLogs');
  const after=prizeStatus(who).unlocked;
  if(after>before){ render(); return celebrate(who); }
  if(after<before) toast('That change un-earned a prize');
  else if(!existing) toast(`${name} logged for ${who}`);
  render();
};

      <button class="btn ghost" onclick="closeSheet()">Later</button></div>`);

function graphBlock(){
  const days=last7();
  const series = habitGraphMode==='habit'
    ? D.habits.map(hb=>({label:hb.name,vals:days.map(d=>D.habitLogs.filter(l=>l.habit===hb.name&&l.day===d).length)}))
    : D.members.map(m=>({label:m.name,vals:days.map(d=>D.habitLogs.filter(l=>l.member===m.name&&l.day===d).length)}));
  const active=series.filter(s=>s.vals.some(v=>v>0));
  const max=Math.max(1,...active.flatMap(s=>s.vals));
  const W=660,H=180,PL=28,PB=26;
  const x=i=>PL+i*((W-PL-10)/6), y=v=>H-PB-(v/max)*(H-PB-14);
  const gridlines=[0,Math.ceil(max/2),max].map(v=>
    `<line x1="${PL}" y1="${y(v)}" x2="${W-10}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
     <text x="4" y="${y(v)+4}" fill="var(--muted)" font-size="11">${v}</text>`).join('');
  const labels=days.map((d,i)=>`<text x="${x(i)}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="middle">${
    new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</text>`).join('');
  const lines=active.map((s,si)=>{
    const col=SERIES[si%SERIES.length];
    const pts=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const dots=s.vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${col}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=active.map((s,si)=>`<span><i style="background:${SERIES[si%SERIES.length]}"></i>${esc(s.label)}</span>`).join('');
  return `<section class="block card"><h3>Last 7 days</h3>
    <div class="chiprow" style="margin-bottom:10px">
      <button class="chip ${habitGraphMode==='habit'?'on':''}" onclick="setGraph('habit')">By habit</button>
      <button class="chip ${habitGraphMode==='member'?'on':''}" onclick="setGraph('member')">By person</button>
    </div>

let noteAuthor=null, noteMode='text', recState=null;

function partURL(scope,id,i,blob){
  const k=scope+':'+id+':'+i;
  if(!mediaURLs.has(k)) mediaURLs.set(k,URL.createObjectURL(blob));
  return mediaURLs.get(k);
}
/* older single-part notes still render through the same path */
const partsOf=m=>m.parts||[{kind:m.kind,text:m.text,blob:m.blob,mime:m.mime}];
function partHTML(p,scope,id,i){
  if(p.kind==='text') return `<p class="body">${esc(p.text)}</p>`;
  if(p.kind==='drawing'||p.kind==='photo') return `<img src="${partURL(scope,id,i,p.blob)}" alt="${p.kind}">`;
  if(p.kind==='audio') return `<audio controls src="${partURL(scope,id,i,p.blob)}"></audio>`;
  return '';
}

window.addPart=async()=>{
  if(noteMode==='text'){
    const t=$('#noteText')?.value.trim();
    if(!t) return toast('Write something first');
    compParts.push({kind:'text',text:t});
  }else if(noteMode==='draw'){
    const cv=$('#draw'); if(!cv) return;
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    compParts.push({kind:'drawing',blob,mime:'image/png'});
  }else if(noteMode==='photo'){

/* ---- drawing: pen, text tool, sizes, fonts, undo ---- */
const INKS=['#ffffff','#a9dcf5','#5fd08a','#f0a35e','#e8646a','#1a1d23'];
const INK_NAMES={'#ffffff':'white','#a9dcf5':'blue','#5fd08a':'green','#f0a35e':'orange','#e8646a':'red','#1a1d23':'black'};
const FONTSIZES=[['S',22],['M',34],['L',52],['XL',76]];
const FONTS=[['Sans','system-ui,sans-serif'],['Serif','Georgia,serif'],['Marker','"Comic Sans MS",cursive']];
let inkColor=INKS[0], drawTool='pen', fontSize=34, fontFam=FONTS[0][1], undoStack=[];
function snapshot(cv){
  const ctx=cv.getContext('2d');
  undoStack.push(ctx.getImageData(0,0,cv.width,cv.height));
  if(undoStack.length>8) undoStack.shift();
}
window.undoDraw=()=>{
  const cv=$('#draw'); if(!cv||!undoStack.length) return toast('Nothing to undo');
  cv.getContext('2d').putImageData(undoStack.pop(),0,0);
};
window.setTool=t=>{drawTool=t;paintTools()};
window.setInk=c=>{inkColor=c;paintTools()};
window.setSize=n=>{fontSize=n;paintTools()};
window.setFont=f=>{fontFam=f;paintTools()};
function paintTools(){
  const tools=$('#tools'); if(!tools) return;
  tools.innerHTML=[['pen','✏️ Pen'],['text','🅰 Text']].map(([k,l])=>
    `<button class="chip ${drawTool===k?'on':''}" onclick="setTool('${k}')">${l}</button>`).join('');
  $('#inks').innerHTML=INKS.map(c=>
    `<button class="ink ${c===inkColor?'on':''}" style="background:${c}" aria-label="${INK_NAMES[c]||'ink'} ink" aria-pressed="${c===inkColor}" onclick="setInk('${c}')"></button>`).join('');
  $('#textTools').innerHTML = drawTool!=='text' ? '' :
    `<input class="field" id="drawText" placeholder="Type, then tap the canvas to place it" style="margin-top:10px">
     <div class="chiprow" style="margin-top:8px">${FONTSIZES.map(([l,n])=>
       `<button class="chip ${fontSize===n?'on':''}" onclick="setSize(${n})">${l}</button>`).join('')}</div>
     <div class="chiprow" style="margin-top:8px">${FONTS.map(([l,f])=>
       `<button class="chip ${fontFam===f?'on':''}" style="font-family:${f}" onclick="setFont(${q(f)})">${l}</button>`).join('')}</div>`;
}
function initComposer(){
  if(noteMode!=='draw') return;
  const cv=$('#draw'); if(!cv) return;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#20252e'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=5;
  undoStack=[]; paintTools();
  let down=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{
    const [x,y]=pos(e);
    if(drawTool==='text'){
      const txt=$('#drawText')?.value;
      if(!txt||!txt.trim()) return toast('Type the words first, then tap');
      snapshot(cv);
      ctx.fillStyle=inkColor; ctx.font=`${fontSize}px ${fontFam}`; ctx.textBaseline='middle';
      ctx.fillText(txt,x,y);
      return;
    }
    snapshot(cv); down=true; [px,py]=[x,y]; cv.setPointerCapture(e.pointerId);
  };
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);
    ctx.strokeStyle=inkColor;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();[px,py]=[x,y]};
  cv.onpointerup=cv.onpointercancel=()=>{down=false};
}
window.clearDraw=()=>{const cv=$('#draw');if(!cv)return;snapshot(cv);
  const ctx=cv.getContext('2d');ctx.fillStyle='#20252e';ctx.fillRect(0,0,cv.width,cv.height)};

/* ---- audio ---- */
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream); const chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      pendingBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      const ap=$('#audioPreview');
      if(ap) ap.innerHTML=`<audio controls src="${URL.createObjectURL(pendingBlob)}"></audio>
        <p class="suggest">${bytes(pendingBlob.size)} — press <b>Add to note</b> to attach it.</p>`;
      const ui=$('#recUI'); if(ui) ui.innerHTML=`<button class="btn primary" onclick="toggleRec()">Record again</button>`;
    };
    rec.start(); recState={rec,stream};
    $('#recUI').innerHTML=`<span class="dot"></span><button class="btn danger" onclick="toggleRec()">Stop</button>`;
  }catch(err){ toast('Microphone unavailable: '+(err.name==='NotAllowedError'?'permission denied':'not found')); }
}
function stopRecIfAny(){ if(recState){try{recState.rec.stop()}catch(e){} recState=null} }
window.toggleRec=()=>{ if(recState){recState.rec.stop();recState=null} else startRec(); };

window.deleteNote=async id=>{
  const m=D.messages.find(x=>x.id===id);
  const n=partsOf(m).length;
  if(!await confirmBox(`Take this note${n>1?` and its ${n} parts`:''} off the board? There is no copy anywhere else.`,'Delete','Keep')) return;
  partsOf(m).forEach((p,i)=>{const k='note:'+id+':'+i;
    if(mediaURLs.has(k)){URL.revokeObjectURL(mediaURLs.get(k));mediaURLs.delete(k)}});
  await del('messages',id); await reload('messages'); render();
};

    : settingsPane==='library'?paneLibrary()

  return bar+pane;
}

function usageCount(store,name){
  if(store==='categories') return D.items.filter(i=>i.category===name).length;
  if(store==='choreTypes') return D.chores.filter(c=>c.type===name).length;
  if(store==='habits') return D.habitLogs.filter(l=>l.habit===name).length;
  if(store==='members') return D.chores.filter(c=>(c.assignees||[]).includes(name)).length+D.habitLogs.filter(l=>l.member===name).length;
  if(store==='stores') return D.shopping.filter(s=>s.store===name).length;
  return 0;
}

window.renameEntry=async(store,id)=>{

    <section class="block card"><input class="field" id="renameField" value="${esc(e.name)}"></section>

window.doRename=async(store,id)=>{
  const e=D[store].find(x=>x.id===id), v=$('#renameField').value.trim();
  if(!v) return toast('Name cannot be blank');
  const old=e.name;
  if(store==='categories') for(const it of D.items.filter(i=>i.category===old)){it.category=v;await put('items',it)}
  if(store==='choreTypes') for(const c of D.chores.filter(c=>c.type===old)){c.type=v;await put('chores',c)}
  if(store==='habits') for(const l of D.habitLogs.filter(l=>l.habit===old)){l.habit=v;await put('habitLogs',l)}
  if(store==='stores') for(const s of D.shopping.filter(s=>s.store===old)){s.store=v;await put('shopping',s)}
  if(store==='members'){
    for(const c of D.chores.filter(c=>(c.assignees||[]).includes(old))){c.assignees=c.assignees.map(a=>a===old?v:a);await put('chores',c)}
    for(const l of D.habitLogs.filter(l=>l.member===old)){l.member=v;await put('habitLogs',l)}
    for(const p of D.prizes.filter(p=>p.to===old||p.from===old)){
      if(p.to===old)p.to=v; if(p.from===old)p.from=v; await put('prizes',p)}
    for(const m of D.messages.filter(m=>m.author===old)){m.author=v;await put('messages',m)}
    if(habitMember===old) habitMember=v;
  }
  e.name=v; await put(store,e);
  await reload(store,'items','chores','habitLogs','shopping','prizes','messages'); closeSheet(); toast('Renamed'); render();
};
window.deleteEntry=async(store,id)=>{
  const e=D[store].find(x=>x.id===id), n=usageCount(store,e.name);
  /* members & habits: history is kept as plain names, so a simple confirm is honest */
  if(store==='members'||store==='habits'||n===0){   /* history keeps plain names, so a simple confirm is honest */
    const msg=n===0?`Delete <b>${esc(e.name)}</b>? Nothing uses it.`
      :`Delete <b>${esc(e.name)}</b>? ${n} past record${n===1?'':'s'} stay in history under this name — only the button goes away.`
        +(store==='members'&&D.prizes.some(p=>p.to===e.name)?` <b>${D.prizes.filter(p=>p.to===e.name).length} queued prize(s) for them will be unreachable.</b>`:'');
    if(await confirmBox(msg,'Delete','Cancel')){
      await del(store,id); await reload(store);
      if(store==='members'&&habitMember===e.name) habitMember=null;
      toast('Deleted'); render();
    }
    return;
  }
  /* categories & chore types: force reassignment, never orphan records */
  const others=D[store].filter(x=>x.id!==id);
  if(others.length===0) return toast('Keep at least one');
  const label=store==='categories'?'item':store==='stores'?'item':'chore';
  showSheet(`<h2>Delete "${esc(e.name)}"</h2>
    <p class="sub">${n} ${label}${n===1?'':'s'} use this. Pick where they move — nothing is deleted with it.</p>
    <section class="block card"><div class="chiprow">${others.map(o=>
      `<button class="chip" onclick="reassign('${store}',${id},${o.id})">${esc(o.name)}</button>`).join('')}</div></section>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancel</button></div>`);
};
window.reassign=async(store,fromId,toId)=>{
  const from=D[store].find(x=>x.id===fromId), to=D[store].find(x=>x.id===toId);
  if(store==='categories') for(const it of D.items.filter(i=>i.category===from.name)){it.category=to.name;it.modified=Date.now();await put('items',it)}
  if(store==='choreTypes') for(const c of D.chores.filter(c=>c.type===from.name)){c.type=to.name;c.modified=Date.now();await put('chores',c)}
  if(store==='stores') for(const s of D.shopping.filter(s=>s.store===from.name)){s.store=to.name;await put('shopping',s)}
  await del(store,fromId);
  await reload(store,'items','chores','shopping'); closeSheet(); toast(`Moved to ${to.name}`); render();
};

/* ---------- library import (the real 984-row deal) ---------- */
const LIBCOLS=['food_id','name','aliases','tags','state','best_storage','ok_storage','best_container',
 'fridge_days_min','fridge_days_max','freezer_days_min','freezer_days_max','pantry_days_min','pantry_days_max',
 'spoilage_signs','tips','review_status','spoilage_review_status','reviewed_by','source','updated'];
const REV_IN={'usda-reviewed':'usda','owner-added':'owner','unreviewed':'unrev'};
function parseLibrary(text,vocab){
  const rows=parseCSV(text);
  if(rows.length<2) return {fatal:'No data rows found.'};
  const head=rows[0].map(c=>c.trim().toLowerCase());
  const missing=LIBCOLS.filter(c=>!head.includes(c));
  if(missing.length) return {fatal:`Missing column${missing.length>1?'s':''}: ${missing.join(', ')}.`};
  const vt=vocab?new Set(vocab.map(v=>v.tag)):null;
  const whatset=vocab?new Set(vocab.filter(v=>v.facet==='what-it-is').map(v=>v.tag)):null;
  const entries=[],rejects=[],warns=[],seen=new Set();
  const dur=(mn,mx,row,zone,errs)=>{
    mn=mn.trim();mx=mx.trim();
    if(!mn&&!mx) return undefined;
    if(SENTINEL[mn]){ if(mx){errs.push(`${zone}: token ${mn} but max is not blank`);return undefined} return mn; }
    if(SENTINEL[mx]){errs.push(`${zone}: token ${mx} in the max column`);return undefined}
    const a=parseFloat(mn),b=parseFloat(mx||mn);
    if(isNaN(a)||isNaN(b)){errs.push(`${zone}: "${mn||mx}" is neither a number nor NR/INDEF/PKG/RIPE`);return undefined}
    if(a>b){errs.push(`${zone}: min ${a} greater than max ${b}`);return undefined}
    return [a,b];
  };
  for(let i=1;i<rows.length;i++){
    const r={}; head.forEach((hh,j)=>r[hh]=(rows[i][j]??'').trim());
    const errs=[],rowWarns=[];
    if(!r.food_id) {rejects.push(`Row ${i+1}: food_id is blank`);continue}
    if(seen.has(r.food_id)) {rejects.push(`Row ${i+1}: duplicate food_id "${r.food_id}"`);continue}
    if(!r.name) {rejects.push(`Row ${i+1} (${r.food_id}): name is blank`);continue}
    if(!ZONE2LOC[r.best_storage]) {rejects.push(`Row ${i+1} (${r.food_id}): best_storage "${r.best_storage}" is not fridge/freezer/pantry/counter`);continue}
    const e={
      id:r.food_id, fid:r.food_id, name:r.name,
      aliases:r.aliases?r.aliases.split('|').filter(Boolean):[],
      tags:r.tags?r.tags.split('|').filter(Boolean):[],
      state:r.state||'', best:ZONE2LOC[r.best_storage],
      ok:(r.ok_storage?r.ok_storage.split('|'):[]).filter(z=>{
        if(!z) return false;
        if(!ZONE2LOC[z]){rowWarns.push(`unknown ok_storage zone "${z}" dropped`);return false}
        return true}).map(z=>ZONE2LOC[z]),
      cont:r.best_container||'',
      signs:r.spoilage_signs?r.spoilage_signs.split('|').filter(Boolean):[],
      tips:r.tips||'',
      review:REV_IN[r.review_status]??(rowWarns.push(`review_status "${r.review_status}" treated as unreviewed`),'unrev'),
      signsReview:REV_IN[r.spoilage_review_status]??(rowWarns.push(`spoilage_review_status "${r.spoilage_review_status}" treated as unreviewed`),'unrev'),
      reviewedBy:r.reviewed_by||'', source:r.source||'', updated:r.updated||'',
    };
    const f=dur(r.fridge_days_min,r.fridge_days_max,r,'fridge',errs);
    const z=dur(r.freezer_days_min,r.freezer_days_max,r,'freezer',errs);
    const p=dur(r.pantry_days_min,r.pantry_days_max,r,'pantry',errs);
    if(errs.length){rejects.push(`Row ${i+1} (${r.food_id}): ${errs.join('; ')}`);continue}
    if(f!==undefined)e.fridge=f; if(z!==undefined)e.freezer=z; if(p!==undefined)e.pantry=p;
    if(vt){
      const unk=e.tags.filter(t=>!vt.has(t));
      if(unk.length) rowWarns.push(`unknown tag${unk.length>1?'s':''}: ${unk.join(', ')}`);
      if(whatset&&!e.tags.some(t=>whatset.has(t))) rowWarns.push('no what-it-is tag');
    }
    if(rowWarns.length) warns.push(`Row ${i+1} (${r.food_id}): ${rowWarns.join('; ')}`);
    seen.add(r.food_id); entries.push(e);
  }
  return {entries,rejects,warns,taggedAgainstVocab:!!vt};
}
function parseVocab(text){
  const rows=parseCSV(text);
  if(rows.length<2) return null;
  const head=rows[0].map(c=>c.trim().toLowerCase());
  if(!head.includes('tag')||!head.includes('facet')) return null;
  return rows.slice(1).map(r=>{const o={};head.forEach((hh,j)=>o[hh]=(r[j]??'').trim());return o})
    .filter(o=>o.tag);
}

/* square-crop and downscale so ten faces cost kilobytes, not megabytes */
function shrinkImage(file,size){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=size;
      const ctx=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);
      c.toBlob(b=>res(b),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}

const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(text){
  const rows=[];let row=[],cur='',inQ=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else inQ=false } else cur+=c }
    else if(c==='"') inQ=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function download(name,text){
  const blob=new Blob([text],{type:'text/csv'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

  </section>`;
}
function libReport(html){const el=$('#libReport');if(el)el.innerHTML=`<div class="report">${html}</div>`}
window.importVocab=async inp=>{
  const f=inp.files[0]; if(!f)return;
  const v=parseVocab(await f.text());
  if(!v) return libReport('<p class="bad">That file does not look like the vocabulary — it needs tag and facet columns.</p>');
  await put('libmeta',{kind:'vocab',tags:v,file:f.name,at:Date.now()});
  await refreshLib(); render();
  toast(`Vocabulary loaded: ${v.length} tags`);
};
window.importLib=async inp=>{
  const f=inp.files[0]; if(!f)return;
  const vmeta=(D.libmeta||[]).find(m=>m.kind==='vocab');
  const res=parseLibrary(await f.text(),vmeta?.tags||null);
  if(res.fatal) return libReport(`<p class="bad">${esc(res.fatal)}</p><p style="margin-top:6px">Nothing was changed.</p>`);
  const {entries,rejects,warns}=res;
  if(!entries.length) return libReport(`<p class="bad">Every row was rejected (${rejects.length}).</p><ul>${rejects.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  const cur=D.library?.length?`replacing the ${D.library.length} imported entries`:'replacing the built-in starter set';
  const okGo=await confirmBox(
    `Import <b>${entries.length}</b> entries from ${esc(f.name)} (${cur})?`+
    (rejects.length?` <b>${rejects.length}</b> row${rejects.length===1?'':'s'} will be skipped.`:'')+
    (warns.length?` ${warns.length} warning${warns.length===1?'':'s'} noted.`:''),
    'Import','Cancel');
  if(!okGo) return;
  await clearStore('library');
  for(const e of entries) await put('library',e);
  await put('libmeta',{kind:'lib',file:f.name,at:Date.now(),rejected:rejects.length,warned:warns.length});
  await refreshLib(); render();
  libReport(`<p class="good">Imported ${entries.length} entries — the app is now using this library.</p>
    ${res.taggedAgainstVocab?'':'<p style="margin-top:6px">Tags were not checked (no vocabulary loaded).</p>'}
    ${rejects.length?`<p class="bad" style="margin-top:8px">Rejected ${rejects.length}:</p><ul>${rejects.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${rejects.length>20?`<p>…and ${rejects.length-20} more.</p>`:''}`:''}
    ${warns.length?`<p style="margin-top:8px;color:var(--soon)">Warnings (imported anyway) — ${warns.length}:</p><ul>${warns.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${warns.length>20?`<p>…and ${warns.length-20} more.</p>`:''}`:''}`);
  inp.value='';
};
window.dropLibrary=async()=>{
  if(!await confirmBox('Remove the imported library and go back to the built-in starter set? Your logged food items are untouched.','Remove','Keep')) return;

let importMode='append';
window.setImportMode=m=>{importMode=m;render()};
window.doImport=async()=>{
  const key=$('#impTable').value, f=$('#impFile').files[0];
  if(!f) return;
  const t=TABLES[key];
  const text=await f.text();
  const rows=parseCSV(text);
  if(rows.length<2) return showReport(`<p class="bad">That file has no data rows.</p>`);
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const missing=t.cols.filter(c=>!head.includes(c));
  if(missing.length) return showReport(`<p class="bad">Wrong file for <b>${key.replace(/_/g,' ')}</b> — missing column${missing.length>1?'s':''}: ${missing.join(', ')}.</p>
    <p style="margin-top:8px">Download the template above to see the expected header row.</p>`);
  const ok=[],bad=[];
  for(let i=1;i<rows.length;i++){
    const obj={}; head.forEach((h,j)=>obj[h]=(rows[i][j]??'').trim());
    const errs=[]; const rec=t.inn(obj,errs);
    if(rec) ok.push(rec); else bad.push(`Row ${i+1}: ${errs.join('; ')}`);
  }
  if(ok.length===0) return showReport(`<p class="bad">Nothing imported — all ${bad.length} rows had problems.</p><ul>${bad.slice(0,20).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`);
  const verb=importMode==='replace'?`Replace all ${D[t.store].length} existing rows with`:'Add';
  if(!await confirmBox(`${verb} ${ok.length} valid row${ok.length===1?'':'s'}?${bad.length?` ${bad.length} row${bad.length===1?'':'s'} will be skipped.`:''}`,'Import','Cancel')) return;
  if(importMode==='replace') await clearStore(t.store);
  for(const rec of ok) await put(t.store,rec);
  await reload(t.store);
  render();   /* refresh counts first — render() rebuilds the pane, so report goes after */
  showReport(`<p class="good">Imported ${ok.length} row${ok.length===1?'':'s'}.</p>${
    bad.length?`<p class="bad" style="margin-top:8px">Skipped ${bad.length}:</p><ul>${bad.slice(0,20).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`
    +(bad.length>20?`<p style="margin-top:6px">…and ${bad.length-20} more.</p>`:''):''}`);
  $('#impFile').value='';
};

function paneStorage(){
  const sizes=STORES.filter(s=>!['messages','prizes'].includes(s)).map(s=>({s,n:D[s].length,b:new Blob([JSON.stringify(D[s])]).size}));
  const media={text:0,drawing:0,photo:0,audio:0};
  const sizeOfParts=m=>partsOf(m).reduce((a,p)=>a+((p.blob?.size)||new Blob([p.text||'']).size),0);
  for(const m of D.messages) for(const p of partsOf(m)) media[p.kind]+=(p.blob?.size)||new Blob([p.text||'']).size;
  const mediaTotal=Object.values(media).reduce((a,b)=>a+b,0);
  const prizeBytes=D.prizes.reduce((a,p)=>a+sizeOfParts(p),0);
  const faceBytes=D.members.reduce((a,m)=>a+(m.avatar?.size||0),0);
  const total=sizes.reduce((a,x)=>a+x.b,0)+mediaTotal+prizeBytes+faceBytes;
  setTimeout(async()=>{
    if(!navigator.storage?.estimate) return;
    const {usage,quota}=await navigator.storage.estimate();
    const el=$('#quota'); if(!el)return;
    const pct=quota?Math.min(100,usage/quota*100):0;
    const persisted=await navigator.storage.persisted?.();
    el.innerHTML=`<div class="kv"><span>Used by this app</span><b>${bytes(usage)}</b></div>
      <div class="kv"><span>Space the browser allows</span><b>${bytes(quota)}</b></div>
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <p class="suggest">${persisted?'Storage is marked persistent — the system should not clear it to reclaim space.'
        :'Storage is <b>not</b> marked persistent. The system could clear it if the tablet runs low on space. Export regularly.'}</p>`;
  },30);
  return `<section class="block card"><h3>Device storage</h3><div id="quota"><p class="suggest">Measuring…</p></div></section>
    <section class="block card"><h3>What's stored here</h3>
      ${sizes.filter(x=>x.n).map(x=>`<div class="kv"><span>${x.s} · ${x.n} row${x.n===1?'':'s'}</span><b>${bytes(x.b)}</b></div>`).join('')}
      ${D.prizes.length?`<div class="kv"><span>prizes · ${D.prizes.length} queued</span><b>${bytes(prizeBytes)}</b></div>`:''}
      ${faceBytes?`<div class="kv"><span>member photos · ${D.members.filter(m=>m.avatar).length}</span><b>${bytes(faceBytes)}</b></div>`:''}
      ${D.library?.length?`<div class="kv"><span>food library · ${D.library.length} entries</span><b>${bytes(new Blob([JSON.stringify(D.library)]).size)}</b></div>`:''}
      ${D.messages.length?`<div class="kv"><span>notes · ${D.messages.length} (${['photo','audio','drawing','text'].filter(k=>media[k]>0).map(k=>D.messages.flatMap(partsOf).filter(p=>p.kind===k).length+' '+k).join(', ')})</span><b>${bytes(mediaTotal)}</b></div>`:''}
      <div class="kv"><span><b>Total data</b></span><b>${bytes(total)}</b></div>
      <p class="suggest">Text records stay tiny — photos and voice notes are what fill a tablet. Delete old media notes from the board when this grows.</p>
    </section>
    <section class="block card"><h3>Erase everything</h3>
      <p class="suggest" style="margin:0 0 10px">Deletes all data on this device. Export first — there is no undo and no copy anywhere else.</p>
      <button class="btn danger" onclick="wipeAll()">Erase all data</button></section>`;
}

function confirmBox(msgHtml,yes,no){
  if(!HAS_DIALOG){  /* pre-2014 browsers: plain confirm keeps the app usable */
    const plain=String(msgHtml).replace(/<[^>]*>/g,'');
    return Promise.resolve(window.confirm(plain));

  return new Promise(res=>{
    const dlg=document.createElement('dialog');

/* ===================== SYNC (Connected edition only) =====================
   No supabase-js. It would have to come from a CDN, which invariant #1 forbids
   and which would end the single-file property; it also persists its session in
   localStorage, which invariant #2 forbids. This is ~100 lines of fetch against
   PostgREST and GoTrue instead, with the session in IndexedDB.

   Storage shape on the server is ONE generic table, adhq.records, holding
   {store, uid, data jsonb, modified, deleted}. See supabase-adhq-schema.sql.
   ======================================================================== */
let syncState={phase:'idle',at:null,msg:''};   /* idle | working | ok | error | off */
let syncSess=null;    /* synchronous mirror of the stored session — render() cannot await */
const meta=async k=>(await getOne('sync',k))||null;
const setMeta=(k,v)=>rawPut('sync',{k,...v});

/* --- auth (GoTrue), session held in IndexedDB, never localStorage --- */
async function session(){ return (syncSess=await meta('session')); }
async function authFetch(path,opts={}){
  const s=await session();
  const h={apikey:SYNC.key,'Content-Type':'application/json',...(opts.headers||{})};
  if(s?.access_token) h.Authorization='Bearer '+s.access_token;
  let r=await fetch(SYNC.url+path,{...opts,headers:h});
  if(r.status===401&&s?.refresh_token){        /* one silent refresh, then give up */
    if(await refreshSession()) return authFetch(path,opts);
  }
  return r;
}
async function refreshSession(){
  const s=await session(); if(!s?.refresh_token) return false;
  const r=await fetch(`${SYNC.url}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST',headers:{apikey:SYNC.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok){ await rawDel('sync','session'); return false; }
  const j=await r.json();
  await setMeta('session',{access_token:j.access_token,refresh_token:j.refresh_token,email:j.user?.email||s.email});
  return true;
}
window.syncSignIn=async()=>{
  const email=($('#syncEmail')?.value||'').trim(), pass=$('#syncPass')?.value||'';
  if(!email||!pass) return toast('Enter the household email and password');
  syncState={phase:'working',at:Date.now(),msg:'Signing in…'}; render();
  try{
    const r=await fetch(`${SYNC.url}/auth/v1/token?grant_type=password`,{
      method:'POST',headers:{apikey:SYNC.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
    await setMeta('session',{access_token:j.access_token,refresh_token:j.refresh_token,email});
    await session();
    syncState={phase:'ok',at:Date.now(),msg:'Signed in'}; toast('Paired'); render();
    await syncNow();
  }catch(e){ syncState={phase:'error',at:Date.now(),msg:String(e.message||e)}; render(); }
};
window.syncSignOut=async()=>{
  await rawDel('sync','session'); syncSess=null;
  syncState={phase:'idle',at:null,msg:'Signed out'};
  toast('This device is no longer paired'); render();
};

/* --- scrub: what actually goes over the wire --- */
function scrub(store,rec){
  const {id,_dirty,avatar,...rest}=rec;   /* id is device-local; avatar is a blob */
  return rest;
}
const PROFILE=m=>m==='GET'?{'Accept-Profile':SYNC.schema}:{'Content-Profile':SYNC.schema};

/* --- the sync pass: push dirty rows + tombstones, then pull deltas --- */
let syncTimer=null;
const syncSoon=()=>{ if(!SYNC.enabled) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),3000); };

window.syncNow=async(quiet)=>{
  if(!SYNC.enabled) return;
  if(!(await session())){ if(!quiet) toast('Pair this device first'); return; }
  if(syncState.phase==='working') return;
  syncState={phase:'working',at:Date.now(),msg:'Syncing…'}; if(!quiet) render();
  try{
    await pushChanges();
    let n=0,page;                      /* page until the server runs out */
    do{ page=await pullChanges(); n+=page; } while(page>=1000);
    syncState={phase:'ok',at:Date.now(),msg:n?`${n} change${n===1?'':'s'} in`:'Up to date'};
    if(n) render(); else if(!quiet) render();
  }catch(e){
    syncState={phase:'error',at:Date.now(),msg:String(e.message||e)};
    if(!quiet) render();
  }
};

async function pushChanges(){
  const rows=[];
  for(const s of SYNC.stores)
    for(const r of (D[s]||[]).filter(x=>x._dirty))
      rows.push({store:s,uid:r.uid,data:scrub(s,r),modified:new Date(r.modified||Date.now()).toISOString(),deleted:false});
  const tombs=(await getAll('sync')).filter(x=>x.k?.startsWith('tomb:')&&x._dirty);
  for(const t of tombs)
    rows.push({store:t.store,uid:t.uid,data:{},modified:new Date(t.at).toISOString(),deleted:true});
  if(!rows.length) return 0;
  const r=await authFetch(`/rest/v1/records?on_conflict=owner,store,uid`,{
    method:'POST',
    headers:{...PROFILE('POST'),Prefer:'resolution=merge-duplicates,return=minimal'},
    body:JSON.stringify(rows)});
  if(!r.ok) throw new Error(`push failed (${r.status}) ${await r.text()}`);
  /* only clear the dirty flags the server actually accepted */
  for(const s of SYNC.stores)
    for(const rec of (D[s]||[]).filter(x=>x._dirty)){ delete rec._dirty; await rawPut(s,rec); }
  for(const t of tombs){ delete t._dirty; await rawPut('sync',t); }
  return rows.length;
}

async function pullChanges(){
  const cur=(await meta('cursor'))?.at||'1970-01-01T00:00:00Z';
  const r=await authFetch(`/rest/v1/records?select=store,uid,data,modified,deleted,synced_at`
    +`&synced_at=gt.${encodeURIComponent(cur)}&order=synced_at.asc&limit=1000`,
    {headers:PROFILE('GET')});
  if(!r.ok) throw new Error(`pull failed (${r.status}) ${await r.text()}`);
  const rows=await r.json();
  if(!rows.length) return 0;
  const touched=new Set();
  for(const row of rows){
    if(!SYNC.stores.includes(row.store)) continue;
    const local=(D[row.store]||[]).find(x=>x.uid===row.uid);
    const remoteAt=Date.parse(row.modified)||0;
    if(local&&(local.modified||0)>remoteAt) continue;          /* local edit is newer — keep it */
    if(row.deleted){ if(local){ await rawDel(row.store,local.id); touched.add(row.store); } continue; }
    const merged={...row.data,uid:row.uid,modified:remoteAt};
    if(local){
      merged.id=local.id;
      if(local.avatar) merged.avatar=local.avatar;             /* blobs are device-local; never clobbered */
    }
    await rawPut(row.store,merged); touched.add(row.store);
  }
  await setMeta('cursor',{at:rows[rows.length-1].synced_at});
  if(touched.size) await reload(...touched);
  return rows.length;
}

/* --- settings pane --- */
function paneSync(){
  if(!SYNC.enabled) return `<section class="block card"><h3>Sync</h3>
    <p class="suggest">This is the <b>Local edition</b>. It has no accounts and makes no network
    requests of any kind — not even to check for updates. Everything stays on this tablet.</p>
    <p class="suggest">To use the Connected edition, set <code>SYNC.enabled</code> to
    <code>true</code> at the top of the script and reload.</p></section>`;
  const sess=syncSess;
  const when=syncState.at?fmtDate(syncState.at)+' '+new Date(syncState.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'never';
  const status=({idle:'Not synced yet',working:'Syncing…',ok:syncState.msg||'Up to date',error:'Problem: '+(syncState.msg||'unknown'),off:'Off'})[syncState.phase]||'Unknown';
  return `<section class="block card"><h3>This device</h3>
      ${sess?`<div class="kv"><span>Paired as</span><b>${esc(sess.email||'signed in')}</b></div>
        <div class="kv"><span>Status</span><b>${esc(status)}</b></div>
        <div class="kv"><span>Last attempt</span><b>${esc(when)}</b></div>
        <div class="actions" style="margin-top:10px">
          <button class="btn" onclick="syncNow()">Sync now</button>
          <button class="btn ghost" onclick="syncSignOut()">Unpair this device</button></div>`
      :`<p class="suggest">Sign in with the shared household account to pair this device.</p>
        <input class="field" id="syncEmail" type="email" placeholder="household email" autocomplete="username">
        <input class="field" id="syncPass" type="password" placeholder="password" autocomplete="current-password" style="margin-top:8px">
        <div class="actions" style="margin-top:10px">
          <button class="btn" onclick="syncSignIn()">Pair device</button></div>
        ${syncState.phase==='error'?`<p class="suggest">${esc(syncState.msg)}</p>`:''}`}
    </section>
    <section class="block card"><h3>What syncs</h3>
      <p class="suggest">Food, chores, chore history, habit logs, the shopping list, names and
      the settings lists. <b>Nothing else.</b></p>
      <p class="suggest">Photos, voice memos, drawings, member photos and prize contents are
      never uploaded — in any edition. They live on this tablet only, and are still not in any
      backup (TRANSFER.md §8).</p></section>`;
}

/* ---------- boot ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>
  b.addEventListener('click',()=>{tab=b.dataset.tab;draft=null;choreDraft=null;render()}));
function tickClock(){
  const n=new Date();
  $('#clock .t').textContent=n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  $('#clock .d').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
/* ---------- capability detection (old tablets are the point) ---------- */
function flexGapOK(){
  try{
    const f=document.createElement('div');
    f.style.cssText='display:flex;flex-direction:column;row-gap:10px;position:absolute;visibility:hidden';
    f.appendChild(document.createElement('div')); f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    const ok=f.scrollHeight===10;
    if(f.parentNode) f.parentNode.removeChild(f);
    return ok;
  }catch(e){ return true; }   /* if we cannot measure, assume modern and leave layout alone */
}
const HAS_DIALOG=typeof HTMLDialogElement!=='undefined'&&!!HTMLDialogElement.prototype.showModal;

(async()=>{
  if(!flexGapOK()) document.documentElement.classList.add('no-flexgap');
  if(navigator.storage?.persist) navigator.storage.persist();
  await openDB(); await loadAll();
  if(SYNC.enabled){
    await session();
    /* on wake / tab focus, not on a timer — a fridge tablet left on for a week
       should not make 20,000 pointless requests */
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncNow(true); });
    syncNow(true);
  }
  tickClock(); setInterval(tickClock,30000);
  render();
})();
</script>
