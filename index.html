  if(rows.length<2) return {fatal:'No data rows found.'};
  const head=rows[0].map(c=>c.trim().toLowerCase());
  const missing=LIBCOLS.filter(c=>!head.includes(c));
  if(missing.length) return {fatal:`Missing column${missing.length>1?'s':''}: ${missing.join(', ')}.`};
  const vt=vocab?new Set(vocab.map(v=>v.tag)):null;
  const whatset=vocab?new Set(vocab.filter(v=>v.facet==='what-it-is').map(v=>v.tag)):null;
  const entries=[],rejects=[],warns=[],seen=new Set();
  const dur=(mn,mx,row,zone,errs)=>{
    mn=mn.trim();mx=mx.trim();
    if(!mn&&!mx) return undefined;
    if(SENTINEL[mn]){ if(mx){errs.push(`${zone}: token ${mn} but max is not blank`);return undefined} return mn; }
    if(SENTINEL[mx]){errs.push(`${zone}: token ${mx} in the max column`);return undefined}
    const a=parseFloat(mn),b=parseFloat(mx||mn);
    if(isNaN(a)||isNaN(b)){errs.push(`${zone}: "${mn||mx}" is neither a number nor NR/INDEF/PKG/RIPE`);return undefined}
    if(a>b){errs.push(`${zone}: min ${a} greater than max ${b}`);return undefined}
    return [a,b];
  };
  for(let i=1;i<rows.length;i++){
    const r={}; head.forEach((hh,j)=>r[hh]=(rows[i][j]??'').trim());
    const errs=[],rowWarns=[];
    if(!r.food_id) {rejects.push(`Row ${i+1}: food_id is blank`);continue}
    if(seen.has(r.food_id)) {rejects.push(`Row ${i+1}: duplicate food_id "${r.food_id}"`);continue}
    if(!r.name) {rejects.push(`Row ${i+1} (${r.food_id}): name is blank`);continue}
    if(!ZONE2LOC[r.best_storage]) {rejects.push(`Row ${i+1} (${r.food_id}): best_storage "${r.best_storage}" is not fridge/freezer/pantry/counter`);continue}
    const e={
      id:r.food_id, fid:r.food_id, name:r.name,
      aliases:r.aliases?r.aliases.split('|').filter(Boolean):[],
      tags:r.tags?r.tags.split('|').filter(Boolean):[],
      state:r.state||'', best:zoneLoc(r.best_storage),
      ok:(r.ok_storage?r.ok_storage.split('|'):[]).filter(z=>{
        if(!z) return false;
        if(!ZONE2LOC[z]){rowWarns.push(`unknown ok_storage zone "${z}" dropped`);return false}
        return true}).map(z=>zoneLoc(z)),
      cont:r.best_container||'',
      signs:r.spoilage_signs?r.spoilage_signs.split('|').filter(Boolean):[],
      tips:r.tips||'',
      review:REV_IN[r.review_status]??(rowWarns.push(`review_status "${r.review_status}" treated as unreviewed`),'unrev'),
      signsReview:REV_IN[r.spoilage_review_status]??(rowWarns.push(`spoilage_review_status "${r.spoilage_review_status}" treated as unreviewed`),'unrev'),
      reviewedBy:r.reviewed_by||'', source:r.source||'', updated:r.updated||'',
    };
    const f=dur(r.fridge_days_min,r.fridge_days_max,r,'fridge',errs);
    const z=dur(r.freezer_days_min,r.freezer_days_max,r,'freezer',errs);
    const p=dur(r.pantry_days_min,r.pantry_days_max,r,'pantry',errs);
    if(errs.length){rejects.push(`Row ${i+1} (${r.food_id}): ${errs.join('; ')}`);continue}
    if(f!==undefined)e.fridge=f; if(z!==undefined)e.freezer=z; if(p!==undefined)e.pantry=p;
    if(vt){
      const unk=e.tags.filter(t=>!vt.has(t));
      if(unk.length) rowWarns.push(`unknown tag${unk.length>1?'s':''}: ${unk.join(', ')}`);
      if(whatset&&!e.tags.some(t=>whatset.has(t))) rowWarns.push('no what-it-is tag');
    }
    if(rowWarns.length) warns.push(`Row ${i+1} (${r.food_id}): ${rowWarns.join('; ')}`);
    seen.add(r.food_id); entries.push(e);
  }
  return {entries,rejects,warns,taggedAgainstVocab:!!vt};
}
function parseVocab(text){
  const rows=parseCSV(text);
  if(rows.length<2) return null;
  const head=rows[0].map(c=>c.trim().toLowerCase());
  if(!head.includes('tag')||!head.includes('facet')) return null;
  return rows.slice(1).map(r=>{const o={};head.forEach((hh,j)=>o[hh]=(r[j]??'').trim());return o})
    .filter(o=>o.tag);
}

/* square-crop and downscale so ten faces cost kilobytes, not megabytes */
function shrinkImage(file,size){
  return new Promise(res=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=c.height=size;
      const ctx=c.getContext('2d');
      const s=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,size,size);
      URL.revokeObjectURL(url);
      c.toBlob(b=>res(b),'image/jpeg',0.82);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);res(file)};
    img.src=url;
  });
}

const csvCell=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
const toCSV=rows=>rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
function parseCSV(text){
  const rows=[];let row=[],cur='',inQ=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++} else inQ=false } else cur+=c }
    else if(c==='"') inQ=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
    else if(c!=='\r') cur+=c;
  }
  if(cur||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function download(name,text){
  const blob=new Blob([text],{type:'text/csv'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

window.importLib=async inp=>{

  if(res.fatal) return libReport(`<p class="bad">${esc(res.fatal)}</p><p style="margin-top:6px">Nothing was changed.</p>`);
  const {entries,rejects,warns}=res;
  if(!entries.length) return libReport(`<p class="bad">Every row was rejected (${rejects.length}).</p><ul>${rejects.slice(0,20).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  const cur=D.library?.length?`replacing the ${D.library.length} imported entries`:'replacing the built-in starter set';
  const okGo=await confirmBox(
    `Import <b>${entries.length}</b> entries from ${esc(f.name)} (${cur})?`+
    (rejects.length?` <b>${rejects.length}</b> row${rejects.length===1?'':'s'} will be skipped.`:'')+
    (warns.length?` ${warns.length} warning${warns.length===1?'':'s'} noted.`:''),
    'Import','Cancel');
  if(!okGo) return;
  await clearStore('library');
  for(const e of entries) await put('library',e);
  /* a hand-imported file is now the local truth; drop the server version so the
     next check re-downloads rather than assuming this device is already current */
  await put('libmeta',{kind:'lib',file:f.name,at:Date.now(),rejected:rejects.length,warned:warns.length,
    version:0,fromServer:false});
  await refreshLib(); render();
  libReport(`<p class="good">Imported ${entries.length} entries — the app is now using this library.</p>

    <div class="stack">

window.doImport=async()=>{
  const key=$('#impTable').value, f=$('#impFile').files[0];
  if(!f) return;
  const t=TABLES[key];
  const text=await f.text();
  const rows=parseCSV(text);
  if(rows.length<2) return showReport(`<p class="bad">That file has no data rows.</p>`);
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const missing=t.cols.filter(c=>!head.includes(c));
  if(missing.length) return showReport(`<p class="bad">Wrong file for <b>${key.replace(/_/g,' ')}</b> — missing column${missing.length>1?'s':''}: ${missing.join(', ')}.</p>
    <p style="margin-top:8px">Download the template above to see the expected header row.</p>`);
  const ok=[],bad=[],soft=[];   /* soft = imported, but something was adjusted */
  for(let i=1;i<rows.length;i++){
    const obj={}; head.forEach((h,j)=>obj[h]=(rows[i][j]??'').trim());
    const errs=[],rw=[]; const rec=t.inn(obj,errs,rw);
    if(rec){ ok.push(rec); if(rw.length) soft.push(`Row ${i+1}: ${rw.join('; ')}`); }
    else bad.push(`Row ${i+1}: ${errs.join('; ')}`);
  }
  if(ok.length===0) return showReport(`<p class="bad">Nothing imported — all ${bad.length} rows had problems.</p><ul>${bad.slice(0,20).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`);
  const verb=importMode==='replace'?`Replace all ${D[t.store].length} existing rows with`:'Add';
  if(!await confirmBox(`${verb} ${ok.length} valid row${ok.length===1?'':'s'}?${bad.length?` ${bad.length} row${bad.length===1?'':'s'} will be skipped.`:''}${soft.length?` ${soft.length} will import with a blank to fill in.`:''}`,'Import','Cancel')) return;
  if(importMode==='replace') await clearStore(t.store);
  for(const rec of ok) await put(t.store,rec);
  await reload(t.store);
  render();   /* refresh counts first — render() rebuilds the pane, so report goes after */
  showReport(`<p class="good">Imported ${ok.length} row${ok.length===1?'':'s'}.</p>${
    bad.length?`<p class="bad" style="margin-top:8px">Skipped ${bad.length}:</p><ul>${bad.slice(0,20).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`
    +(bad.length>20?`<p style="margin-top:6px">…and ${bad.length-20} more.</p>`:''):''}${
    soft.length?`<p style="margin-top:8px;color:var(--soon)">Imported with a blank left to fill — ${soft.length}:</p><ul>${soft.slice(0,20).map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`
    +(soft.length>20?`<p style="margin-top:6px">…and ${soft.length-20} more.</p>`:''):''}`);
  $('#impFile').value='';
};

/* ---------- storage readout ---------- */
/* ===================== TIDY UP: DUPLICATES =====================
   Deliberately a MERGE, not a delete. Two copies of "Wash sheets" are rarely
   identical — one has the room, the other has the time estimate — so throwing
   the extras away loses information that was typed in by hand. The keeper
   absorbs every field the others have and it does not, then the rest go.

   Deletion goes through del(), so tombstones are written and the removals
   propagate to the other devices instead of being resurrected on next pull.
   ============================================================== */
const DUPSPEC={
  chores:{label:'Chores',   key:c=>norm(c.title), title:c=>c.title,
          fields:['type','area','minutes','dueBy','notes','recurrence','interval','checkIn','assignees','priority','needsHelp']},
  items: {label:'Food',     key:i=>norm(i.name)+'|'+norm(i.location||''), title:i=>i.name,
          fields:['category','location','container','libId','eatBy']},
};
const norm=s=>String(s??'').toLowerCase().replace(/\s+/g,' ').trim();
const filled=v=>Array.isArray(v)?v.length>0:v!==null&&v!==undefined&&v!==''&&v!==false;

function dupGroups(store){
  const spec=DUPSPEC[store], by={};
  for(const r of D[store]||[]){ const k=spec.key(r); if(k) (by[k]??=[]).push(r); }
  return Object.values(by).filter(g=>g.length>1).map(g=>{
    /* keep the richest record; oldest wins a tie, so the original survives */
    const score=r=>spec.fields.filter(f=>filled(r[f])).length;
    const sorted=[...g].sort((a,b)=>score(b)-score(a)||(a.created||0)-(b.created||0)||a.id-b.id);
    return {keep:sorted[0],drop:sorted.slice(1),
            gains:spec.fields.filter(f=>!filled(sorted[0][f])&&sorted.slice(1).some(r=>filled(r[f])))};
  }).sort((a,b)=>b.drop.length-a.drop.length);
}
let tidyStore='chores';
window.setTidy=s=>{tidyStore=s;render()};
function paneTidy(){
  const spec=DUPSPEC[tidyStore], groups=dupGroups(tidyStore);
  const nDrop=groups.reduce((n,g)=>n+g.drop.length,0);
  const rows=groups.slice(0,60).map(g=>{
    const gain=g.gains.length?`<span class="chip sm">keeps ${g.gains.length} field${g.gains.length===1?'':'s'} from the copies</span>`:'';
    return `<div class="brow"><b>${esc(spec.title(g.keep))}</b>
      <div class="bchips"><span class="chip sm">${g.drop.length+1} copies → 1</span>${gain}</div></div>`;
  }).join('');
  return `<section class="block card"><h3>Duplicates</h3>
    <div class="chiprow" style="margin-bottom:10px">${Object.entries(DUPSPEC).map(([s,sp])=>
      `<button class="chip ${tidyStore===s?'on':''}" onclick="setTidy('${s}')">${sp.label}</button>`).join('')}</div>
    ${groups.length?`
      <p class="suggest">${groups.length} title${groups.length===1?'':'s'} appear more than once —
      <b>${nDrop}</b> extra record${nDrop===1?'':'s'} in total.</p>
      <div class="btable">${rows}</div>
      ${groups.length>60?`<p class="suggest">…and ${groups.length-60} more.</p>`:''}
      <div class="actions" style="margin-top:12px">
        <button class="btn" onclick="mergeDupes()">Merge into ${groups.length}</button></div>
      <p class="suggest" style="margin-top:10px">Nothing is thrown away blindly: the copy that survives
      first absorbs every field the others filled in and it did not. Removals are recorded properly, so
      they disappear on your other devices too rather than coming back on the next sync.</p>`
    :`<p class="suggest">No duplicate ${spec.label.toLowerCase()} found. Two entries count as duplicates
      when their ${tidyStore==='chores'?'titles match':'names and places match'}, ignoring capitals and
      extra spaces.</p>`}
  </section>`;
}
window.mergeDupes=async()=>{
  const store=tidyStore, spec=DUPSPEC[store], groups=dupGroups(store);
  if(!groups.length) return toast('Nothing to merge');
  const nDrop=groups.reduce((n,g)=>n+g.drop.length,0);
  if(!await confirmBox(`Merge <b>${groups.length}</b> duplicated ${spec.label.toLowerCase()} entries and remove
    <b>${nDrop}</b> extra copies?<br><br>The surviving entry keeps every field any copy had filled in.`,
    'Merge','Cancel')) return;
  let filledIn=0;
  for(const g of groups){
    let changed=false;
    for(const f of spec.fields){
      if(filled(g.keep[f])) continue;
      const src=g.drop.find(r=>filled(r[f]));
      if(src){ g.keep[f]=src[f]; changed=true; filledIn++; }
    }
    if(changed){ g.keep.modified=Date.now(); await put(store,g.keep); }
    for(const r of g.drop) await del(store,r.id);
  }
  await reload(store);
  render();
  toast(`Merged ${groups.length} · removed ${nDrop} copies${filledIn?` · recovered ${filledIn} fields`:''}`,{sticky:true});
};

function paneStorage(){

  return `<section class="block card"><h3>This build</h3>

    <section class="block card"><h3>Device storage</h3><div id="quota"><p class="suggest">Measuring…</p></div></section>
    <section class="block card"><h3>What's stored here</h3>

      ${D.prizes.length?`<div class="kv"><span>prizes · ${D.prizes.length} queued</span><b>${bytes(prizeBytes)}</b></div>`:''}
      ${faceBytes?`<div class="kv"><span>member photos · ${D.members.filter(m=>m.avatar).length}</span><b>${bytes(faceBytes)}</b></div>`:''}
      ${D.library?.length?`<div class="kv"><span>food library · ${D.library.length} entries</span><b>${bytes(new Blob([JSON.stringify(D.library)]).size)}</b></div>`:''}
      ${D.messages.length?`<div class="kv"><span>notes · ${D.messages.length} (${['photo','audio','drawing','text'].filter(k=>media[k]>0).map(k=>D.messages.flatMap(partsOf).filter(p=>p.kind===k).length+' '+k).join(', ')})</span><b>${bytes(mediaTotal)}</b></div>`:''}

      <button class="btn danger" onclick="wipeAll()">Erase all data</button></section>`;
}

function confirmBox(msgHtml,yes,no){

/* ===================== SYNC (Connected edition only) =====================
   No supabase-js. It would have to come from a CDN, which invariant #1 forbids
   and which would end the single-file property; it also persists its session in
   localStorage, which invariant #2 forbids. This is ~100 lines of fetch against
   PostgREST and GoTrue instead, with the session in IndexedDB.

   Storage shape on the server is ONE generic table, adhq.records, holding
   {store, uid, data jsonb, modified, deleted}. See supabase-adhq-schema.sql.
   ======================================================================== */
let syncState={phase:'idle',at:null,msg:''};   /* idle | working | ok | error | off */
let syncSess=null;    /* synchronous mirror of the stored session — render() cannot await */
const meta=async k=>(await getOne('sync',k))||null;
const setMeta=(k,v)=>rawPut('sync',{k,...v});

/* --- auth (GoTrue). Session in the CONTROL database, never localStorage --- */
async function session(){ return (syncSess=(await ctlGet('session'))||null); }
async function authFetch(path,opts={}){
  const s=await session();
  const h={apikey:SYNC.key,'Content-Type':'application/json',...(opts.headers||{})};
  if(s?.access_token) h.Authorization='Bearer '+s.access_token;
  let r=await fetch(SYNC.url+path,{...opts,headers:h});
  if(r.status===401&&s?.refresh_token){        /* one silent refresh, then give up */
    if(await refreshSession()) return authFetch(path,opts);
  }
  return r;
}
async function refreshSession(){
  const s=await session(); if(!s?.refresh_token) return false;
  const r=await fetch(`${SYNC.url}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST',headers:{apikey:SYNC.key,'Content-Type':'application/json'},
    body:JSON.stringify({refresh_token:s.refresh_token})});
  if(!r.ok){ await ctlDel('session'); syncSess=null; return false; }
  const j=await r.json();
  await ctlPut('session',{access_token:j.access_token,refresh_token:j.refresh_token,
    email:j.user?.email||s.email,uid:j.user?.id||s.uid});
  await session();
  return true;
}
window.syncSignIn=async()=>{
  const email=($('#syncEmail')?.value||'').trim(), pass=$('#syncPass')?.value||'';
  if(!email||!pass) return gateError('Enter the household email and password');
  syncState={phase:'working',at:Date.now(),msg:'Signing in…'};
  gateBusy(true);
  try{
    const r=await fetch(`${SYNC.url}/auth/v1/token?grant_type=password`,{
      method:'POST',headers:{apikey:SYNC.key,'Content-Type':'application/json'},
      body:JSON.stringify({email,password:pass})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
    await ctlPut('session',{access_token:j.access_token,refresh_token:j.refresh_token,
      email,uid:j.user?.id||null});
    await session();
    syncState={phase:'ok',at:Date.now(),msg:'Signed in'};
    await startHousehold();          /* opens THIS household's database */
    toast('Signed in');
    syncNow(true); libSync(true);
  }catch(e){
    syncState={phase:'error',at:Date.now(),msg:String(e.message||e)};
    gateBusy(false); gateError(String(e.message||e));
    if(!gated) render();
  }
};

window.syncSignOut=async()=>{
  if(!await confirmBox(
    'Sign out of this household?<br><br>Everything on this tablet stays exactly where it is — '
    +'food, chores, notes, photos and voice memos are not deleted. Signing back in picks them up again.',
    'Sign out','Cancel')) return;
  await ctlDel('session'); syncSess=null;
  syncState={phase:'idle',at:null,msg:'Signed out'};

/* --- scrub: what actually goes over the wire --- */
function scrub(store,rec){
  const {id,_dirty,avatar,...rest}=rec;   /* id is device-local; avatar is a blob */
  return rest;
}
const PROFILE=m=>m==='GET'?{'Accept-Profile':SYNC.schema}:{'Content-Profile':SYNC.schema};

/* --- the sync pass: push dirty rows + tombstones, then pull deltas --- */
let syncTimer=null;
const syncSoon=()=>{ if(!SYNC.enabled) return;
  clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow(true),3000); };

window.syncNow=async(quiet)=>{
  if(!SYNC.enabled) return;
  if(!(await session())){ if(!quiet) toast('Pair this device first'); return; }
  if(syncState.phase==='working') return;
  syncState={phase:'working',at:Date.now(),msg:'Syncing…'}; if(!quiet) render();
  try{
    let partial=null;
    try{ await pushChanges(); }
    catch(e){ if(e.partial) partial=e; else throw e; }   /* one bad store must not stop the rest */
    let n=0,page;                      /* page until the server runs out */
    do{ page=await pullChanges(); n+=page; } while(page>=1000);
    syncState=partial
      ? {phase:'error',at:Date.now(),msg:partial.message}
      : {phase:'ok',at:Date.now(),msg:n?`${n} change${n===1?'':'s'} in`:'Up to date'};
    if(n||partial) render(); else if(!quiet) render();
  }catch(e){
    syncState={phase:'error',at:Date.now(),msg:String(e.message||e)};
    if(!quiet) render();
  }
};

/* Push per store, not as one bulk insert.

   The first version sent every dirty row in a single POST. One row the server
   would not accept — a store name added by a newer app build than the database
   knows about — failed the whole statement, so a single new feature stopped ALL
   sync, including stores that were perfectly valid. An additive app change
   became a total outage. Batching by store isolates that: the unknown store
   fails alone, its rows stay dirty and retry later, and everything else lands. */
async function pushChanges(){
  const groups={};
  for(const s of SYNC.stores)
    for(const r of (D[s]||[]).filter(x=>x._dirty))
      (groups[s]??={rows:[],recs:[],tombs:[]}).rows.push(
        {store:s,uid:r.uid,data:scrub(s,r),modified:new Date(r.modified||Date.now()).toISOString(),deleted:false}),
      groups[s].recs.push(r);
  const tombs=(await getAll('sync')).filter(x=>x.k?.startsWith('tomb:')&&x._dirty);
  for(const t of tombs){
    const g=(groups[t.store]??={rows:[],recs:[],tombs:[]});
    g.rows.push({store:t.store,uid:t.uid,data:{},modified:new Date(t.at).toISOString(),deleted:true});
    g.tombs.push(t);
  }

  let sent=0; const failed=[];
  for(const [store,g] of Object.entries(groups)){
    if(!g.rows.length) continue;
    const r=await authFetch('/rest/v1/records?on_conflict=owner,store,uid',{
      method:'POST',
      headers:{...PROFILE('POST'),Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify(g.rows)});
    if(!r.ok){
      const body=await r.text();
      failed.push({store,msg:/records_store_allowed/.test(body)
        ? `the server does not yet allow the "${store}" store — run the latest migration`
        : `${r.status} ${body.slice(0,120)}`});
      continue;                       /* leave these dirty; they retry next pass */
    }
    for(const rec of g.recs){ delete rec._dirty; await rawPut(store,rec); }
    for(const t of g.tombs){ delete t._dirty; await rawPut('sync',t); }
    sent+=g.rows.length;
  }
  if(failed.length) throw Object.assign(
    new Error(failed.map(f=>f.msg).join(' · ')),{partial:true,sent,failed});
  return sent;
}

async function pullChanges(){
  const cur=(await meta('cursor'))?.at||'1970-01-01T00:00:00Z';
  /* owner=eq is redundant with RLS, which already scopes every row to this
     household. It is here as defence in depth: if a policy is ever edited
     wrongly, this device declines to merge another household's chores rather
     than silently absorbing them. */
  const me=(await session())?.uid;
  const r=await authFetch(`/rest/v1/records?select=store,uid,data,modified,deleted,synced_at`
    +(me?`&owner=eq.${encodeURIComponent(me)}`:'')
    +`&synced_at=gt.${encodeURIComponent(cur)}&order=synced_at.asc&limit=1000`,
    {headers:PROFILE('GET')});
  if(!r.ok) throw new Error(`pull failed (${r.status}) ${await r.text()}`);
  const rows=await r.json();
  if(!rows.length) return 0;
  const touched=new Set();
  for(const row of rows){
    if(!SYNC.stores.includes(row.store)) continue;
    const local=(D[row.store]||[]).find(x=>x.uid===row.uid);
    const remoteAt=Date.parse(row.modified)||0;
    if(local&&(local.modified||0)>remoteAt) continue;          /* local edit is newer — keep it */
    if(row.deleted){ if(local){ await rawDel(row.store,local.id); touched.add(row.store); } continue; }
    const merged={...row.data,uid:row.uid,modified:remoteAt};
    if(local){
      merged.id=local.id;
      if(local.avatar) merged.avatar=local.avatar;             /* blobs are device-local; never clobbered */
    }
    await rawPut(row.store,merged); touched.add(row.store);
  }
  await setMeta('cursor',{at:rows[rows.length-1].synced_at});
  if(touched.size) await reload(...touched);
  return rows.length;
}

/* --- hosted food library (Connect only) ---
   Reference content, so it rides none of the sync machinery above: no uids, no
   tombstones, no conflicts. One version integer decides whether to fetch at all. */
let libState={phase:'idle',msg:''};

async function libServerMeta(){
  const r=await authFetch('/rest/v1/library_meta?select=version,file,rows,vocab,published_at&limit=1',
    {headers:PROFILE('GET')});
  if(!r.ok) throw new Error(`library check failed (${r.status})`);
  return (await r.json())[0]||null;
}
/* PostgREST caps a response at 1000 rows and says nothing when it truncates.
   The library is 984 today, so one update tips it over and the app would
   silently serve a partial food-safety reference. Always page. */
async function libFetchAll(){
  const PAGE=500, out=[];
  for(let offset=0;;offset+=PAGE){
    const r=await authFetch(`/rest/v1/library?select=entry&order=fid.asc&limit=${PAGE}&offset=${offset}`,
      {headers:PROFILE('GET')});
    if(!r.ok) throw new Error(`library download failed (${r.status})`);
    const rows=await r.json();
    out.push(...rows.map(x=>x.entry));
    if(rows.length<PAGE) break;          /* a short page is the only end signal */
    if(out.length>20000) throw new Error('library unexpectedly large — stopping');
  }
  return out;
}
window.libSync=async(quiet)=>{
  if(!SYNC.enabled) return;
  if(!(await session())){ if(!quiet) toast('Pair this device first'); return; }
  libState={phase:'working',msg:'Checking…'}; if(!quiet) render();
  try{
    const srv=await libServerMeta();
    const local=(D.libmeta||[]).find(m=>m.kind==='lib');
    if(!srv||!srv.rows){ libState={phase:'ok',msg:'Nothing published yet'}; if(!quiet) render(); return; }
    if(local&&local.version>=srv.version){
      libState={phase:'ok',msg:`Up to date (v${srv.version})`}; if(!quiet) render(); return;
    }
    libState={phase:'working',msg:`Downloading v${srv.version}…`}; if(!quiet) render();
    const entries=await libFetchAll();
    if(entries.length!==srv.rows)
      throw new Error(`expected ${srv.rows} entries, got ${entries.length} — not replacing`);
    await clearStore('library');
    for(const e of entries) await rawPut('library',e);
    await rawPut('libmeta',{kind:'lib',file:srv.file||'server',at:Date.parse(srv.published_at)||Date.now(),
      version:srv.version,rejected:0,warned:0,fromServer:true});
    if(srv.vocab) await rawPut('libmeta',{kind:'vocab',tags:srv.vocab,file:srv.file||'server',at:Date.now()});
    await refreshLib();
    libState={phase:'ok',msg:`Updated to v${srv.version} · ${entries.length} entries`};
    render(); toast(`Food library updated (${entries.length} entries)`);
  }catch(e){ libState={phase:'error',msg:String(e.message||e)}; render(); }
};
window.libPublish=async()=>{
  if(!D.library?.length) return toast('Import a library here first, then publish it');
  const vmeta=(D.libmeta||[]).find(m=>m.kind==='vocab');
  if(!await confirmBox(`Publish these <b>${D.library.length}</b> entries to the server? Every paired device will replace its library with this on next check.`,'Publish','Cancel')) return;
  libState={phase:'working',msg:'Publishing…'}; render();
  try{
    const meta=(D.libmeta||[]).find(m=>m.kind==='lib');
    const r=await authFetch('/rest/v1/rpc/publish_library',{
      method:'POST',headers:PROFILE('POST'),
      body:JSON.stringify({entries:D.library,file:meta?.file||'library.csv',vocab:vmeta?.tags||null})});
    const body=await r.text();
    if(!r.ok) throw new Error(/not a library publisher/.test(body)
      ? 'this account is not a library publisher' : `publish failed (${r.status}) ${body}`);
    const srv=await libServerMeta();
    await rawPut('libmeta',{...meta,kind:'lib',version:srv?.version??1});
    await refreshLib();
    libState={phase:'ok',msg:`Published v${srv?.version??'?'} · ${body} entries`};
    render(); toast('Library published');
  }catch(e){ libState={phase:'error',msg:String(e.message||e)}; render(); }
};

/* ===================== HOUSEHOLD GATE =====================
   Connected edition only. The gate asks "is a session stored on this device?",
   NOT "can we reach the server?" — a fridge tablet has to open and work when the
   wifi is down, which is the entire product thesis. Once signed in, the app runs
   fully offline and syncs opportunistically.
   ========================================================= */
let gated=false;
function gateError(msg){ const e=$('#gateErr'); if(e) e.innerHTML=msg?`<p class="bad">${esc(msg)}</p>`:''; }
function gateBusy(on){
  const b=$('#gateGo'); if(!b) return;
  b.disabled=!!on; b.textContent=on?'Signing in…':'Sign in';
}
function viewGate(){
  return `<section class="block card gatecard">
      <h2>ADHQ</h2>
      <p class="sub">Sign in with your household account. One account per household —
      every device in the house uses the same one.</p>
      <div class="stack">
        <input class="field" id="syncEmail" type="email" placeholder="household email"
          autocomplete="username" onkeydown="if(event.key==='Enter')$('#syncPass').focus()">
        <input class="field" id="syncPass" type="password" placeholder="password"
          autocomplete="current-password" onkeydown="if(event.key==='Enter')syncSignIn()">
        <button class="btn primary" id="gateGo" onclick="syncSignIn()">Sign in</button>
      </div>
      <div id="gateErr"></div>
      <p class="suggest" style="margin-top:14px">Each household gets its own storage on this
      device. Signing in as a different household never mixes with, or overwrites, what is
      already here.</p>
      <p class="suggest">Photos, voice memos, drawings and prize contents stay on this device
      in every case — they are never uploaded.</p>
    </section>`;
}
function showGate(){
  gated=true;
  document.documentElement.classList.add('gated');
  $('#main').className='gate'; $('#main').innerHTML=viewGate();
  const e=$('#syncEmail'); if(e) e.focus();
}
/* open the signed-in household's own database and start the app proper */
async function startHousehold(){
  const s=await session();
  await openDB(await dbNameFor(s?.uid));
  await loadAll();
  gated=false;
  document.documentElement.classList.remove('gated');
  $('#main').className='';
  render();
}

/* --- settings pane --- */
function paneSync(){
  if(!SYNC.enabled) return `<section class="block card"><h3>Sync</h3>
    <p class="suggest">This is the <b>Local edition</b>. It has no accounts and makes no network
    requests of any kind — not even to check for updates. Everything stays on this tablet.</p>
    <p class="suggest">To use the Connected edition, set <code>SYNC.enabled</code> to
    <code>true</code> at the top of the script and reload.</p></section>`;
  const sess=syncSess;
  const when=syncState.at?fmtDate(syncState.at)+' '+new Date(syncState.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'never';
  const status=({idle:'Not synced yet',working:'Syncing…',ok:syncState.msg||'Up to date',error:'Problem: '+(syncState.msg||'unknown'),off:'Off'})[syncState.phase]||'Unknown';
  return `<section class="block card"><h3>This device</h3>
      ${sess?`<div class="kv"><span>Paired as</span><b>${esc(sess.email||'signed in')}</b></div>
        <div class="kv"><span>Status</span><b>${esc(status)}</b></div>
        <div class="kv"><span>Last attempt</span><b>${esc(when)}</b></div>
        <div class="actions" style="margin-top:10px">
          <button class="btn" onclick="syncNow()">Sync now</button>
          <button class="btn ghost" onclick="syncSignOut()">Sign out</button></div>
        <p class="suggest">Signing out leaves everything on this tablet untouched — it only
        forgets the account. Nothing is deleted, and nothing is uploaded on the way out.</p>`
      :`<p class="suggest">This device is signed out. Reload the app to sign in again.</p>`}
    </section>
    <section class="block card"><h3>What syncs</h3>
      <p class="suggest">Food, chores, chore history, habit logs, the shopping list, names and
      the settings lists. <b>Nothing else.</b></p>
      <p class="suggest">Photos, voice memos, drawings, member photos and prize contents are
      never uploaded — in any edition. They live on this tablet only, and are still not in any
      backup (TRANSFER.md §8).</p></section>`;
}

/* ---------- boot ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>
  b.addEventListener('click',()=>{tab=b.dataset.tab;draft=null;choreDraft=null;render()}));
function tickClock(){
  const n=new Date();
  $('#clock .t').textContent=n.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  $('#clock .d').textContent=n.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}
/* ---------- capability detection (old tablets are the point) ---------- */
function flexGapOK(){
  try{
    const f=document.createElement('div');
    f.style.cssText='display:flex;flex-direction:column;row-gap:10px;position:absolute;visibility:hidden';
    f.appendChild(document.createElement('div')); f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    const ok=f.scrollHeight===10;
    if(f.parentNode) f.parentNode.removeChild(f);
    return ok;
  }catch(e){ return true; }   /* if we cannot measure, assume modern and leave layout alone */
}
const HAS_DIALOG=typeof HTMLDialogElement!=='undefined'&&!!HTMLDialogElement.prototype.showModal;

(async()=>{
  if(!flexGapOK()) document.documentElement.classList.add('no-flexgap');
  if(navigator.storage?.persist) navigator.storage.persist();
  await openControl();
  tickClock(); setInterval(tickClock,30000);
  if(SYNC.enabled){
    /* on wake / tab focus, not on a timer — a fridge tablet left on for a week
       should not make 20,000 pointless requests */
    document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&!gated) syncNow(true); });
    const s=await session();
    if(!s) return showGate();        /* no session stored: gate. No network needed to decide. */
    try{ await startHousehold(); }
    catch(e){                        /* never leave a blank screen with only a console error */
      document.documentElement.classList.remove('gated');
      $('#main').className='';
      $('#main').innerHTML=`<section class="block card"><h3>Storage could not be opened</h3>
        <p class="suggest">${esc(String(e.message||e))}</p>
        <p class="suggest">Your data is still on this device. Closing every other tab running ADHQ
        and reloading usually clears this — an open tab on an older version can block the upgrade.</p>
        <div class="actions"><button class="btn" onclick="location.reload()">Reload</button></div></section>`;
      return;
    }
    syncNow(true); libSync(true);
    return;
  }
  await openDB('adhq'); await loadAll();
  render();
})();
</script>
</body>
</html>
