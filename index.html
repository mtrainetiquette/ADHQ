<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADHQ</title>
<style>
  :root{
    /* --- palette: swap this block to re-theme the whole app --- */
    --bg:#14171c; --panel:#1d2129; --panel-2:#242a34; --line:#39414e;
    --text:#eef0f3; --muted:#9aa4b2;
    --accent:#a9dcf5;            /* baby blue */
    --accent-ink:#08161f;        /* text on accent */
    --outline:#ffffff;           /* crisp outline on active things */
    --outline-dim:rgba(255,255,255,.42);
    --shadow-ink:#000000;
    /* status colors stay semantic — these signal food safety, not decoration */
    --fresh:#5fd08a; --soon:#f0a35e; --late:#e8646a; --cool:#6fb3e8; --plum:#b98ae0;
    --tap:56px; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
    /* kills double-tap zoom jitter WITHOUT killing pinch-zoom (a11y: WCAG 1.4.4).
       #draw sets touch-action:none, which is stricter and still wins on the canvas. */
    touch-action:manipulation}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;color:var(--text)}
  /* screen-reader-only: visible to assistive tech, not on screen.
     Used to give bare count badges spoken context ("Food, 3 items"). */
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  /* respect the OS "reduce motion" setting — vestibular disorders, and some
     neurodivergent users find movement actively distracting */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important;scroll-behavior:auto!important}
  }

  #app{max-width:820px;margin:0 auto 0 96px;min-height:100%;display:flex;flex-direction:column;position:relative}
  header.top{position:absolute;top:12px;right:16px;z-index:5;text-align:right;pointer-events:none}
  header.top .now{font-variant-numeric:tabular-nums;line-height:1.1}
  header.top .now .t{display:block;font-size:30px;font-weight:800;letter-spacing:-.01em;
    color:var(--accent);text-shadow:0 2px 0 var(--shadow-ink)}
  header.top .now .d{display:block;font-size:13px;font-weight:700;color:var(--muted)}
  @media (max-width:400px){header.top .now .t{font-size:24px}header.top .now .d{font-size:11px}}
  main{flex:1;padding:18px 14px 40px}
  /* The clock is absolutely positioned, so it does not reserve space and nothing
     below it knows it is there. Two consequences had to be handled explicitly:
     (a) the first control row must stop SHORT of the clock rather than merely
         padding itself — with overflow-x:auto, padding lets chips scroll
         underneath it, which is what happened once Settings grew to ten panes;
     (b) a view with no control row at all (Shop) has nothing to offset, so main
         reserves the height instead. render() sets .nosub. */
  main > .subbar:first-child,main > div:first-child > .subbar:first-child{
    width:calc(100% - 150px);flex-wrap:wrap;overflow-x:visible}
  main.nosub{padding-top:72px}
  @media (max-width:400px){
    main > .subbar:first-child,main > div:first-child > .subbar:first-child{width:calc(100% - 120px)}
    main{padding-top:14px}
    main.nosub{padding-top:58px}
  }
  /* gate: no tabs, no clock — nothing to interact with until a household is chosen */
  .gated nav.tabs,.gated header.top{display:none}
  .gated #app{margin-left:auto;margin-right:auto;max-width:520px}
  main.gate{padding-top:8vh;max-width:460px;margin:0 auto}
  main.gate h2{font-size:30px;letter-spacing:-.02em;margin:0 0 6px}
  main.gate .sub{color:var(--muted);margin:0 0 16px}
  main.gate .bad{margin-top:10px}
  /* filter stack: one plain question per row, so the chips are self-explaining */
  .filterrow{margin-bottom:2px}
  .filterrow .flabel{display:block;font-size:12px;font-weight:700;color:var(--muted);
    letter-spacing:.02em;padding:0 4px 2px}
  .filterrow .subbar{padding:2px 4px 8px}
  .filterrow:empty{display:none}

  /* bulk edit: collapsed to one line until asked for */
  .bulk{margin:2px 0 10px}
  .bulkhead{width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:12px 14px;font-weight:700;color:var(--text);min-height:48px;cursor:pointer}
  .bulk.open .bulkhead{border-bottom-left-radius:0;border-bottom-right-radius:0}
  .bulkhead .caret{float:right;color:var(--muted)}
  .bulkhead .headnote{font-weight:600;color:var(--muted);font-size:13px;margin-left:8px}
  .bulk.open .bulkbody .filterrow:last-child .subbar{padding-bottom:0}
  .bulkbody{border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;
    background:var(--panel-2);padding:12px 14px}
  .selcount{align-self:center;font-weight:700;color:var(--muted);font-size:13px}
  .pick{flex:none;width:38px;height:38px;border-radius:10px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
  .pick.on{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .itemcard.picked{outline:2px solid var(--accent);outline-offset:-2px}

  /* menu: six destinations at a size you can hit while holding a toddler */
  .menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:4px 0}
  @media (max-width:640px){.menugrid{grid-template-columns:repeat(2,1fr)}}
  .menutile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:150px;padding:18px 10px;border-radius:16px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);cursor:pointer}
  .menutile:active{background:var(--panel-2)}
  .menutile .mico{font-size:44px;line-height:1}
  .menutile .mlabel{font-size:19px;font-weight:800}
  .menutile .msub{font-size:13px;color:var(--muted);font-weight:600;text-align:center}
  /* 16:9 without a magic pixel height, so it works on a phone and a tablet */
  .vidwrap{position:relative;width:100%;aspect-ratio:16/9;margin:10px 0 14px;
    border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}
  .vidwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .rich{line-height:1.55}
  .rich h4{font-size:15px;font-weight:800;margin:14px 0 6px;letter-spacing:.01em}
  .rich p{margin:8px 0}
  .rich ul{margin:8px 0 8px 20px}
  .rich li{margin:4px 0}
  .rich a{color:var(--accent);text-decoration:underline}
  .rich strong{font-weight:800}
  .needs{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;
    font-size:11px;font-weight:700;background:var(--panel-2);color:var(--muted);
    border:1px solid var(--line);vertical-align:middle}
  .btable{display:flex;flex-direction:column;gap:8px}
  .brow{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
  .brow>b{display:block;margin-bottom:5px}
  .bchips{display:flex;flex-wrap:wrap;gap:5px}
  .chip.sm{min-height:0;padding:2px 9px;font-size:12px;font-weight:600}
  .chip.sm.new{border-style:dashed}
  .chip.sm.gap{opacity:.75;font-style:italic}

  nav.tabs{position:fixed;left:0;top:0;bottom:0;z-index:20;width:88px;
    background:var(--panel);border-right:1px solid var(--line);
    padding:calc(10px + env(safe-area-inset-top)) 8px 10px}
  nav.tabs .row{height:100%;display:flex;flex-direction:column;gap:8px;
    background:none;border:none;padding:0}
  nav.tabs button{min-height:74px;border-radius:12px;font-weight:700;font-size:12px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
    border:2px solid transparent}
  nav.tabs .ico{font-size:28px;line-height:1.1;filter:grayscale(.45) opacity(.75)}
  nav.tabs button.on{background:var(--panel-2);color:var(--text);
    border-color:var(--outline);box-shadow:0 0 0 3px var(--shadow-ink), 0 0 0 4px var(--accent)}
  nav.tabs button.on .ico{filter:none}
  nav.tabs .n{position:absolute;top:4px;right:6px;min-width:20px;padding:0 5px;border-radius:999px;
    background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;
    font-variant-numeric:tabular-nums;border:1px solid var(--shadow-ink)}
  nav.tabs .n.alert{background:var(--late);color:#fff}
  nav.tabs .n:empty,nav.tabs .n.zero{display:none}
  @media (max-width:400px){nav.tabs{width:72px}nav.tabs .ico{font-size:24px}nav.tabs button{font-size:11px;min-height:64px}}

  .micro{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
  .btn{min-height:var(--tap);padding:10px 18px;border-radius:12px;font-weight:700;
    background:var(--panel-2);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--outline)}
  .btn.danger{color:var(--late);border-color:#7f4f59}
  .btn.ghost{background:none}
  .btn.sm{min-height:44px;padding:6px 14px;font-size:15px}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px}
  .chip{min-height:44px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:15px;
    background:var(--panel-2);border:1px solid var(--line)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--outline);
    box-shadow:0 0 0 2px var(--shadow-ink)}
  .chip.big{min-height:var(--tap);font-size:17px;padding:10px 20px}
  .field{width:100%;min-height:var(--tap);padding:12px 14px;border-radius:12px;
    background:var(--panel-2);border:1px solid var(--line)}
  textarea.field{min-height:90px;resize:vertical}
  .stack{display:flex;flex-direction:column;gap:10px}
  .empty{padding:40px 20px;text-align:center;color:var(--muted)}
  .empty strong{color:var(--text)}
  .subbar{display:flex;gap:8px;padding:6px 4px 12px;overflow-x:auto}
  section.block{padding:16px;margin-top:14px}
  section.block h3{font-size:16px;font-weight:800;margin-bottom:10px}
  .rowsplit{display:flex;gap:10px;flex-wrap:wrap}
  .rowsplit>*{flex:1;min-width:150px}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow .field{flex:1}

  .itemcard{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:12px 14px;min-height:72px}
  .itemcard + .itemcard{margin-top:8px}
  .days{flex:0 0 62px;height:62px;border-radius:14px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
    background:var(--panel-2);border:1px solid var(--line)}
  .days b{font-size:22px;font-weight:800;line-height:1}
  .days span{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-top:3px}
  .days.fresh{border-color:var(--fresh)} .days.fresh b{color:var(--fresh)}
  .days.soon{border-color:var(--soon)}  .days.soon b{color:var(--soon)}
  .days.late{border-color:var(--late);background:#3b313a}
  .days.late b{color:var(--late)}
  .days.none b{color:var(--muted);font-size:18px}
  .iteminfo{flex:1;min-width:0}
  /* Wrap, do not truncate. A clipped title hides the end of the sentence, and on
     a phone that was eating the due date and the room as well. Cards grow
     instead; min-height keeps short ones from looking thin. */
  .iteminfo .nm{font-size:18px;font-weight:700;overflow-wrap:anywhere;word-break:break-word}
  .iteminfo .meta{color:var(--muted);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
  .itemcard>.daychip,.itemcard>.pick,.itemcard>.days{margin-top:2px}
  .grouphead{padding:18px 6px 8px}
  .flags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .flag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
    padding:2px 8px;border-radius:999px}
  .flag.pri{background:rgba(232,100,106,.20);color:var(--late)}
  .flag.help{background:rgba(111,179,232,.20);color:var(--cool)}
  .flag.who{background:var(--panel-2);color:var(--muted)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .grid .chip{justify-content:center;display:flex;align-items:center;min-height:var(--tap)}
  .suggest{color:var(--muted);font-size:14px;margin-top:8px}
  .suggest .tag{color:var(--accent)}

  .rev{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase}
  .rev.usda{background:rgba(95,208,138,.18);color:var(--fresh)}
  .rev.owner{background:rgba(169,220,245,.18);color:var(--accent)}
  .rev.unrev{background:rgba(154,164,178,.18);color:var(--muted)}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
  .sheet{width:100%;max-width:820px;max-height:88vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .sheet .sub{color:var(--muted);margin-top:2px}
  .guide{margin-top:14px;padding:14px;background:var(--panel-2);border-radius:12px}
  .guide dt{margin-top:10px} .guide dt:first-child{margin-top:0} .guide dd{margin-top:3px}
  .guide .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .sheet .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .sheet .actions .btn{flex:1;min-width:140px}
  dialog.confirm{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--text);
    padding:22px;max-width:420px;width:90%}
  dialog.confirm::backdrop{background:rgba(0,0,0,.55)}
  dialog.confirm p{margin-bottom:16px}
  dialog.confirm .actions{display:flex;gap:10px}
  dialog.confirm .actions .btn{flex:1}

  .shoprow,.listrow{display:flex;align-items:center;gap:12px;padding:8px 14px;min-height:var(--tap)}
  .shoprow + .shoprow,.listrow + .listrow{border-top:1px solid var(--line)}
  .shoprow .tick{flex:0 0 40px;height:40px;border-radius:10px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800}
  .shoprow.done .tick{background:var(--fresh);border-color:var(--fresh);color:#0c2416}
  .shoprow.done .nm{text-decoration:line-through;color:var(--muted)}
  .shoprow .nm,.listrow .nm{flex:1;text-align:left;font-weight:600;overflow-wrap:anywhere}
  .listrow .cnt{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

  .streak{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:var(--tap)}
  .streak + .streak{border-top:1px solid var(--line)}
  .streak .nm{flex:1;font-weight:600}
  .streak .flame{font-variant-numeric:tabular-nums;font-weight:800;color:var(--accent)}
  .streak .best{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:14px}
  .legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}

  .bar{height:10px;border-radius:999px;background:var(--panel-2);overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-variant-numeric:tabular-nums}
  .kv + .kv{border-top:1px solid var(--line)}
  .report{background:var(--panel-2);border-radius:12px;padding:12px;margin-top:12px;font-size:15px;max-height:260px;overflow:auto}
  .report .bad{color:var(--late)} .report .good{color:var(--fresh)}
  .report ul{margin:8px 0 0 18px}

  /* ---------- notes board ---------- */
  .note{padding:12px 14px;margin-top:10px}
  .note .head{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin-bottom:8px}
  .note .head b{color:var(--text)}
  .note .head .x{margin-left:auto}
  .note p.body{white-space:pre-wrap;font-size:18px}
  .note img{max-width:100%;border-radius:10px;display:block;background:var(--panel-2)}
  .note audio{width:100%;margin-top:2px}
  .note .part + .part{margin-top:10px}
  .partlist{margin:10px 0 0}
  .partrow{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-2);
    border-radius:10px;margin-top:6px}
  .partrow .ic{font-size:20px}
  .partrow .nm{flex:1;font-size:15px;overflow-wrap:anywhere}
  .toolrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .composer .modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
  .composer .modes .chip{justify-content:center;display:flex;min-height:var(--tap)}
  #drawWrap{position:relative;margin-top:10px}
  #draw{width:100%;border-radius:12px;border:1px solid var(--line);touch-action:none;display:block;background:#20252e}
  .inkrow{display:flex;gap:8px;margin-top:10px;align-items:center}
  .ink{width:44px;height:44px;border-radius:50%;border:2px solid var(--line)}
  .ink.on{border-color:var(--outline);box-shadow:0 0 0 2px var(--shadow-ink)}
  .rec{display:flex;align-items:center;gap:12px;margin-top:10px}
  .rec .dot{width:14px;height:14px;border-radius:50%;background:var(--late);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.rec .dot{animation:none}}
  .face{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block;
    border:2px solid var(--line);background:var(--panel-2)}
  .face.sm{width:26px;height:26px;display:inline-block;vertical-align:middle;margin-right:6px}
  .face.lg{width:64px;height:64px}
  .chip.on .face{border-color:var(--accent-ink)}
  .chip.hasface{padding:5px 10px}
  /* prizes */
  .prize{display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:var(--tap)}
  .prize + .prize{border-top:1px solid var(--line)}
  .prize .lock{font-size:26px;width:34px;text-align:center}
  .prize .nm{flex:1}
  .prize .nm b{display:block}
  .prize .nm span{color:var(--muted);font-size:14px}
  .prize.open{background:rgba(169,220,245,.10)}
  .goal{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-top:14px;
    border:2px dashed #7696aa;border-radius:var(--radius)}
  .goal .big{font-size:30px}
  .goal .txt{flex:1}
  .goal .txt b{display:block;font-size:17px}
  .goal .txt span{color:var(--muted);font-size:14px}
  /* shopping, tighter */
  .storehead{display:flex;align-items:baseline;gap:8px;padding:14px 6px 6px}
  .shoprow{display:flex;align-items:center;gap:10px;padding:3px 12px;min-height:46px}
  .shoprow .tick{flex:0 0 34px;height:34px;border-radius:8px;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800}
  .shoprow .mv{color:var(--muted);font-size:13px;padding:4px 8px;min-height:34px}
  /* --- fallback for browsers without flexbox gap (pre-2020); .no-flexgap set at boot --- */
  .no-flexgap .chiprow,.no-flexgap .subbar,.no-flexgap .toolrow,.no-flexgap .inkrow,
  .no-flexgap .legend,.no-flexgap .actions,.no-flexgap .rowsplit{margin-left:-4px;margin-right:-4px}
  .no-flexgap .chiprow>*,.no-flexgap .subbar>*,.no-flexgap .toolrow>*,.no-flexgap .inkrow>*,
  .no-flexgap .legend>*,.no-flexgap .actions>*,.no-flexgap .rowsplit>*{margin:4px}
  .no-flexgap .stack>*+*{margin-top:10px}
  .no-flexgap nav.tabs .row>*+*{margin-top:8px}
  .no-flexgap .addrow>*+*{margin-left:8px}
  .no-flexgap .itemcard>*+*,.no-flexgap .listrow>*+*,.no-flexgap .shoprow>*+*,
  .no-flexgap .streak>*+*,.no-flexgap .prize>*+*,.no-flexgap .partrow>*+*,
  .no-flexgap .note .head>*+*,.no-flexgap .rec>*+*,.no-flexgap .goal>*+*{margin-left:10px}
  .no-flexgap .storehead>*+*{margin-left:8px}
  .toast{position:fixed;left:calc(50% + 44px);bottom:24px;transform:translateX(-50%);z-index:40;
    background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:14px 10px 14px 20px;
    font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(92% - 88px);
    display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 22px var(--shadow-ink)}
  .toast.show{opacity:1;pointer-events:auto}
  .toast .tmsg{flex:1;min-width:0}
  /* 48px square: a fingertip target, not a decorative dismiss */
  .toast .tx{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);

   right to keep them, because by uid they genuinely were different rows.
   Seeds are the same content everywhere, so they must have the same identity
   everywhere. Not cryptographic; it only has to be stable and well spread. */
function stableUid(s){
  let a=0x9e3779b9,b=0x85ebca6b,c=0xc2b2ae35,d=0x27d4eb2f;
  for(let i=0;i<s.length;i++){
    const k=s.charCodeAt(i);
    a=Math.imul(a^k,2654435761)>>>0; b=Math.imul(b^a,1597334677)>>>0;
    c=Math.imul(c^b,2246822519)>>>0; d=Math.imul(d^c,3266489917)>>>0;
  }
  const hx=n=>(n>>>0).toString(16).padStart(8,'0');
  const raw=hx(a)+hx(b)+hx(c)+hx(d);
  return `${raw.slice(0,8)}-${raw.slice(8,12)}-5${raw.slice(13,16)}-${
    ((parseInt(raw[16],16)&0x3|0x8).toString(16))}${raw.slice(17,20)}-${raw.slice(20,32)}`;
}
const uuid=()=>(globalThis.crypto?.randomUUID?crypto.randomUUID()
  :'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16)}));

/* Every app write goes through these two. In the Local edition they are the
   original one-liners. In the Connected edition they additionally stamp a
   device-independent `uid`, a `modified` clock, and a dirty flag — and record
   a tombstone on delete, because without one a delete here is simply undone
   by the next pull from another device. */
async function put(s,v){
  if(syncable(s)){ v.uid??=uuid(); v.modified=Date.now(); v._dirty=1; syncSoon(); }
  return rawPut(s,v);
}
async function del(s,k){
  if(syncable(s)){
    const rec=await getOne(s,k);
    if(rec?.uid){ await rawPut('sync',{k:`tomb:${s}:${rec.uid}`,store:s,uid:rec.uid,at:Date.now(),_dirty:1}); syncSoon(); }
  }
  return rawDel(s,k);
}

/* ---------- state ---------- */
/* Derived from STORES so it cannot drift out of step with it. Hand-listing the
   keys is how `messages`, `stores` and `prizes` ended up missing here, which is
   why a failure in loadAll turned into "cannot read properties of undefined"
   inside render() instead of one clear error. */
const D=Object.fromEntries(STORES.map(s=>[s,[]]));
let tab='menu', foodSub='list', sortMode='soonest', draft=null, foodSearch='';
let choreFilterType=null, choreFilterWho=null, choreDraft=null;
let batch=null, foodGapsOnly=false, choreGapsOnly=false;
let choreFilterTime=null, choreFilterArea=null, choreFilterDue=null, choreFilterPri=false;
let choreSel=new Set(), bulkOpen=false, filtersOpen=false, choreView='tasks';
let habitMember=null, habitGraphMode='habit', habitDate=null;
let settingsPane='members';

async function loadAll(){
  const got=await Promise.all(STORES.map(getAll));
  STORES.forEach((s,i)=>D[s]=got[i]);
  /* Seeded rows get a uid derived from store+name, so every device that seeds
     produces byte-identical identities and the server upsert collapses them
     into one row instead of one per device. */
  const seed=async(store,names)=>{ if(D[store].length===0){
    for(const name of names) await put(store,{name,uid:stableUid(store+'|'+norm(name))});
    D[store]=await getAll(store);} };
  await seed('categories',DEFAULT_CATS);
  await seed('common',DEFAULT_COMMON);
  await seed('choreTypes',DEFAULT_CHORE_TYPES);
  await seed('habits',DEFAULT_HABITS);
  await seed('stores',DEFAULT_STORES);
  await seed('areas',DEFAULT_AREAS);
  if(D.locations.length===0){
    for(const l of DEFAULT_LOCATIONS) await put('locations',{...l,uid:stableUid('locations|'+norm(l.name))});
    D.locations=await getAll('locations'); }
  await migrateStorage();
  await migrateUids();
  await dedupeVocab();
  await refreshLib();
}
/* The lists in Setup are vocabularies: two entries with the same name are never
   deliberate — the add form already refuses them. So collapse them silently on
   load rather than making someone visit a cleanup screen. Chores and food are
   NOT in here; those need human judgement and stay in Setup -> Duplicates.

   Nothing has to be repointed: chores store their type as a NAME, not an id, so
   removing a same-named twin cannot orphan anything. */
const VOCAB_STORES=['categories','common','choreTypes','habits','stores','locations','areas','members'];
async function dedupeVocab(){
  let removed=0;
  for(const store of VOCAB_STORES){
    const by={};
    for(const r of D[store]||[]){ const k=norm(r.name); if(k) (by[k]??=[]).push(r); }
    for(const g of Object.values(by)){
      if(g.length<2) continue;
      /* keep the richest — a member with a photo, a location with a zone — and
         the oldest on a tie, so the entry people have been using survives */
      const score=r=>Object.keys(r).filter(k=>!['id','uid','_dirty','modified'].includes(k)&&filled(r[k])).length;
      const sorted=[...g].sort((a,b)=>score(b)-score(a)||(a.created||a.id)-(b.created||b.id));
      for(const dup of sorted.slice(1)){ await del(store,dup.id); removed++; }
    }
    if(removed) await reload(store);
  }
  if(removed) console.info(`ADHQ: collapsed ${removed} duplicate list entries`);
  return removed;
}

/* one-time per store: records created before sync was switched on have no `uid`.
   The integer `id` stays as the IndexedDB key — 2,000 lines of app code reference
   it — but it is device-local and collides across devices, so it can never be the
   sync key. `uid` is. Backfilled records are marked dirty so the first sync
   uploads them rather than silently leaving them behind. */
async function migrateUids(){
  if(!SYNC.enabled) return;
  for(const s of SYNC.stores){
    const missing=(D[s]||[]).filter(r=>!r.uid);
    if(!missing.length) continue;
    for(const r of missing){ r.uid=uuid(); r.modified??=r.created??Date.now(); r._dirty=1; await rawPut(s,r); }
    await reload(s);
  }
}
/* one-time: the old model had a single `method` mixing places and containers */
async function migrateStorage(){
  const OLD_CONT={'Sealed container':'Sealed container','Original packaging':'Original packaging'};
  const OLD_LOC={'Fridge shelf':'Fridge shelf','Crisper drawer':'Crisper drawer','Door':'Fridge door','Freezer':'Freezer'};
  let touched=false;
  for(const it of D.items){
    if(it.method===undefined) continue;
    if(OLD_LOC[it.method]) it.location??=OLD_LOC[it.method];
    else if(OLD_CONT[it.method]) it.container??=OLD_CONT[it.method];
    delete it.method; touched=true;
    await put('items',it);
  }
  if(touched) await reload('items');
}
const reload=async(...s)=>{ for(const k of s) D[k]=await getAll(k); };

/* ---------- library matching ---------- */
let LIB=LIBRARY;  /* active library: imported set when present, built-in starter otherwise */
async function refreshLib(){
  D.library=await getAll('library'); D.libmeta=await getAll('libmeta');
  LIB=D.library.length?D.library:LIBRARY;
}
const libById=id=>id?LIB.find(e=>e.id===id)||null:null;
function libFor(item){ return libById(item.libId)||libMatch(item.name); }
function preferOpened(list){
  if(list.length<2) return list[0]||null;
  /* same name, multiple states: prefer the opened variant — its keep times are the
     conservative ones, and a logged item is more often open than factory-sealed */
  return list.find(e=>/(^|\W)opened/.test(e.state||'')&&!/unopened/.test(e.state||''))||list[0];
}
function libMatch(name){
  const q=(name||'').trim().toLowerCase(); if(!q) return null;
  const exact=LIB.filter(e=>e.name.toLowerCase()===q);
  if(exact.length) return preferOpened(exact);
  const alias=LIB.filter(e=>e.aliases.some(a=>a.toLowerCase()===q));
  if(alias.length) return preferOpened(alias);
  return LIB.find(e=>q.includes(e.name.toLowerCase().split(' (')[0])&&e.name.length>3)
      || LIB.find(e=>e.aliases.some(a=>q.includes(a.toLowerCase())&&a.length>3))
      || null;
}
/* free-text container phrase -> one of the app's container buttons (miss = null, harmless) */
function contButton(txt){
  const s=(txt||'').toLowerCase(); if(!s) return null;
  if(/original|jar|can\b|carton|packaging/.test(s)) return 'Original packaging';
  if(/bag/.test(s)) return 'Bag';
  if(/airtight|sealed|container/.test(s)) return 'Sealed container';
  if(/wrap|foil/.test(s)) return 'Wrapped';
  if(/uncover|open dish|plate/.test(s)) return 'Uncovered';
  return null;
}
const ZONE2LOC={fridge:'Fridge shelf',freezer:'Freezer',pantry:'Pantry',counter:'Counter'};
function libRange(entry,location){
  if(!entry) return null;
  const key=locKey(location)||'fridge';
  const v=entry[key];
  if(v===undefined) return null;
  if(isSentinel(v)) return {token:v,where:key,location};
  return {days:v,where:key,location};
}

/* ---------- dates ---------- */
const DAY=86400000;
const fmtDate=ts=>new Date(ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const todayISO=()=>{const d=new Date();d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
const isoPlus=n=>{const d=new Date(Date.now()+n*DAY);d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
/* "Someday" — worth doing, no timeline. Stored as the literal string 'someday'
   in dueBy rather than a far-future date, because a sentinel date lies: it would
   show as "in 3650 days", land in a Next-7-days window the moment someone edits
   it, and become a real overdue chore in ten years.
   The rule everything else follows: someday sorts LAST, always. */
const SOMEDAY='someday';
const isSomeday=c=>c?.dueBy===SOMEDAY;
const hasRealDate=v=>!!v&&v!==SOMEDAY;
function daysUntil(iso){
  if(!iso||iso===SOMEDAY) return null;
  const t=new Date();t.setHours(0,0,0,0);
  const e=new Date(iso+'T00:00:00');
  return Math.round((e-t)/DAY);
}
const daysLeft=it=>daysUntil(it.eatBy);
function dayClass(d){ if(d===null)return'none'; if(d<0)return'late'; if(d<=2)return'soon'; return'fresh'; }
function dayChip(d){
  const cls=dayClass(d);
  const big=d===null?'—':(d<0?Math.abs(d)+'d':d+'d');
  const lab=d===null?'no date':(d<0?'over':(d===0?'today':'left'));
  return `<span class="days ${cls}"><b>${big}</b><span>${lab}</span></span>`;
}
function advance(iso,rec,interval,from){
  const base=new Date((from||iso)+'T12:00:00');
  if(rec==='daily') base.setDate(base.getDate()+1);
  else if(rec==='weekly') base.setDate(base.getDate()+7);
  else if(rec==='monthly'){
    /* clamp instead of overflowing: Jan 31 + 1 month = Feb 28, not Mar 3 */
    const day=base.getDate();
    base.setDate(1); base.setMonth(base.getMonth()+1);
    const lastDay=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
    base.setDate(Math.min(day,lastDay));
  }
  else if(rec==='custom') base.setDate(base.getDate()+(interval||1));
  return base.toISOString().slice(0,10);
}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>JSON.stringify(String(s)).replace(/"/g,'&quot;');
/* 1.9s was not long enough to read "7 rows added, 2 need details" — let alone
   act on it. Now it holds for 9s, or indefinitely for anything reporting a
   count or a problem, and always has a real dismiss button. */
function toast(msg,opts){
  const t=$('#toast'); if(!t) return;
  const sticky=opts?.sticky ?? /\d/.test(String(msg));
  t.innerHTML=`<span class="tmsg"></span><button class="tx" onclick="hideToast()" aria-label="Dismiss">×</button>`;
  t.querySelector('.tmsg').textContent=msg;
  t.classList.add('show');
  clearTimeout(t._h);
  if(!sticky) t._h=setTimeout(hideToast,9000);
}
window.hideToast=()=>{const t=$('#toast'); if(t){clearTimeout(t._h); t.classList.remove('show');}};
const mediaURLs=new Map();
const bytes=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(0)+' KB':(n/1048576).toFixed(1)+' MB';

/* ---------- member avatars (shared: habits, chores, notes, prizes) ---------- */
function avatarURL(m){
  if(!m?.avatar) return null;
  const k='avatar:'+m.id;
  if(!mediaURLs.has(k)) mediaURLs.set(k,URL.createObjectURL(m.avatar));
  return mediaURLs.get(k);
}
const memberByName=n=>D.members.find(m=>m.name===n);
/* compact=true -> the picture stands in for the name (filters); else picture + name */
function memberFace(name,compact){
  const m=memberByName(name), u=avatarURL(m);
  if(!u) return esc(name);
  return compact
    ? `<img class="face" src="${u}" alt="${esc(name)}" title="${esc(name)}">`
    : `<img class="face sm" src="${u}" alt=""> ${esc(name)}`;
}

/* ---------- render ---------- */
function render(){
  const overdue=D.chores.filter(c=>!isRoutine(c)&&hasRealDate(c.dueBy)&&(daysUntil(c.dueBy)??99)<0).length;
  $('#nFood').textContent=D.items.length;
  $('#nShop').textContent=D.shopping.filter(s=>!s.done).length;
  const nc=$('#nChores');
  const dueNow=D.chores.filter(c=>!isRoutine(c)&&hasRealDate(c.dueBy)&&(daysUntil(c.dueBy)??99)<=0).length;
  nc.textContent=dueNow; nc.classList.toggle('alert',overdue>0);
  /* a11y: badges are aria-hidden numerals; these give them spoken context. */
  const say=(id,n,noun)=>{const e=$(id); if(e) e.textContent=n?`, ${n} ${noun}${n===1?'':'s'}`:'';};
  say('#nFoodSR',D.items.length,'item');
  say('#nShopSR',D.shopping.filter(s=>!s.done).length,'item to buy');
  say('#nChoresSR',dueNow,overdue>0?'chore due, some overdue':'chore due');
  say('#nNotesSR',D.messages.length,'note');
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    const on=b.dataset.tab===tab;
    b.classList.toggle('on',on);
    on?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current');
  });
  const m=$('#main');
  $('#nNotes').textContent=D.messages.length;
  $('#nNotes').classList.toggle('zero',D.messages.length===0);
  m.classList.remove('nosub');
  m.innerHTML = tab==='menu'?viewMenu()
    : tab==='food'?viewFood()
    : tab==='chores'?viewChores()
    : tab==='habits'?viewHabits()
    : tab==='shop'?viewShop()
    : tab==='notes'?viewNotes()
    : viewSettings();
  /* reserve the clock's height only when this view has no control row to sit beside */
  const f=m.firstElementChild;
  const hasSub=!!f&&(f.classList.contains('subbar')
    ||(!!f.firstElementChild&&f.firstElementChild.classList.contains('subbar')));
  if(!hasSub) m.classList.add('nosub');
  if(tab==='notes') hydrateMedia();
}

/* ===================== FOOD ===================== */
/* Derived, never stored — same reasoning as prize milestones (TRANSFER.md §4).
   Filling a blank in makes the tag disappear on its own. */
const itemGaps=it=>[!it.category&&'category',!it.location&&'place',!it.eatBy&&'eat-by'].filter(Boolean);
/* A routine has no due date or assignee by design, so those are not gaps for it. */
const choreGaps=c=>isRoutine(c)
  ? [!c.type&&'type',!(+c.minutes>0)&&'time estimate'].filter(Boolean)
  : [!c.type&&'type',!c.dueBy&&'due date',!(c.assignees||[]).length&&'who',!(+c.minutes>0)&&'time estimate'].filter(Boolean);
const gapTag=g=>g.length?`<span class="needs">needs details</span>`:'';
function itemCard(it){
  const meta=[it.category,it.location,it.container,it.eatBy?'eat by '+fmtDate(it.eatBy+'T12:00:00'):null].filter(Boolean).join(' · ');
  return `<button class="itemcard card" onclick="openItem(${it.id})">
    ${dayChip(daysLeft(it))}
    <span class="iteminfo"><span class="nm">${esc(it.name)}${gapTag(itemGaps(it))}</span><span class="meta">${esc(meta)}</span></span>
  </button>`;
}
function itemMatches(it,query){
  const words=query.toLowerCase().split(/\s+/).filter(Boolean);
  if(!words.length) return true;
  const lib=libFor(it);
  const hay=[it.name,it.category,it.location,it.container,
    lib?.name,lib?.category,...(lib?.aliases||[]),...(lib?.tags||[])]
    .filter(Boolean).join(' ').toLowerCase();
  return words.every(w=>hay.includes(w));
}
window.setSearch=v=>{foodSearch=v;render();
  const el=$('#foodSearch');

function viewFood(){

  const pool=D.items.filter(it=>itemMatches(it,foodSearch)&&(!foodGapsOnly||itemGaps(it).length));
  if(pool.length===0) return sub+search+`<div class="empty card"><p><strong>No matches for "${esc(foodSearch)}".</strong></p>
    <p>Search covers names, places, and the library's tags and aliases.</p></div>`;
  let body='';

      ? [...LOCS().map(l=>l.name),blank].filter(k=>g[k])

    body=s.map(itemCard).join('');

  return sub+search+bar+body;
}

/* one phrasing of a due date, used by the card, the sheet and the bulk toast */
const routineWhen=c=>{
  const days=(c.rdays||[]).length?c.rdays.map(n=>WEEKDAYS[n][1]).join(', ')
    :(+c.interval>1?`every ${c.interval} days`:'every day');
  const times=(c.slots||[]).length?` · ${c.slots.join(', ')}`:'';
  return `routine · ${days}${times}`;
};
const dueLabel=c=>isSomeday(c)?'someday':(c.dueBy?'due '+fmtDate(c.dueBy+'T12:00:00'):'no due date');
const minsLabel=m=>m>=120?`${(m/60).toFixed(m%60?1:0)} hr`:m>=60?`${(m/60).toFixed(m%60?1:0)} hr`:`${m} min`;

/* ===================== ROUTINES =====================
   Feeding the cat twice a day is not a task, it is a rhythm. The list of things
   that are DIFFERENT about today is the valuable thing, and a rhythm repeated
   every morning drowns it.

   Occurrences are DERIVED from the chore, never stored. There is no row per
   breakfast. That is what makes the auto-close requirement cheap: an occurrence
   nobody ticked simply reads as lapsed once its grace period passes. The
   alternative — a background job writing "done" rows — would need the tablet to
   be awake, would invent history nobody performed, and would sync that fiction
   to every device. Nothing is written unless a person actually taps a name.

   Consequence worth stating: a lapsed occurrence is NOT in choreHistory, so it
   credits nobody, feeds no streak and counts toward no prize. Auto-closing
   clears the screen; it does not claim the work was done.
   =================================================== */
const WEEKDAYS=[['0','Sun'],['1','Mon'],['2','Tue'],['3','Wed'],['4','Thu'],['5','Fri'],['6','Sat']];
const ROUTINE_PRESETS=[
  {label:'Every day',        rdays:[],        interval:1},
  {label:'Every other day',  rdays:[],        interval:2},
  {label:'Weekdays',         rdays:[1,2,3,4,5]},
  {label:'Weekends',         rdays:[0,6]},
  {label:'Tue & Fri',        rdays:[2,5]},
];
const SLOT_PRESETS=[
  {label:'Once a day',            slots:[]},
  {label:'Breakfast & dinner',    slots:['Breakfast','Dinner']},
  {label:'Three meals',           slots:['Breakfast','Lunch','Dinner']},
  {label:'Morning & evening',     slots:['Morning','Evening']},
];
const isRoutine=c=>!!c?.routine;
const rslots=c=>(Array.isArray(c.slots)&&c.slots.length?c.slots:['']);
const isoOf=n=>isoPlus(n);
const dowOf=iso=>new Date(iso+'T12:00:00').getDay();

/* Is this routine active on this date? */
function routineActive(c,iso){
  if(Array.isArray(c.rdays)&&c.rdays.length) return c.rdays.includes(dowOf(iso));
  const n=+c.interval>1?+c.interval:1;
  if(n===1) return true;
  const anchor=c.ranchor||(c.created?new Date(c.created).toISOString().slice(0,10):iso);
  const diff=Math.round((new Date(iso+'T12:00:00')-new Date(anchor+'T12:00:00'))/DAY);
  return ((diff%n)+n)%n===0;
}
const rkey=(c,iso,i)=>`${c.id}|${iso}|${i}`;
const rlog=(c,iso,i)=>(D.routineLogs||[]).find(l=>l.key===rkey(c,iso,i));

/* GRACE_DAYS=1: an occurrence for today can still be ticked tomorrow. Once the
   whole of the next day has passed it lapses on its own. */
const GRACE_DAYS=1;
function rStatus(c,iso,i){
  if(rlog(c,iso,i)) return 'done';
  const age=-(daysUntil(iso)??0);            /* days since that date */
  if(age>GRACE_DAYS) return 'lapsed';
  if(age>0) return 'late';                   /* yesterday, still tickable */
  return 'open';
}
function routineDay(iso){
  const out=[];
  for(const c of D.chores.filter(isRoutine)){
    if(!routineActive(c,iso)) continue;
    rslots(c).forEach((slot,i)=>out.push({c,iso,i,slot,status:rStatus(c,iso,i),log:rlog(c,iso,i)}));
  }
  return out;
}
/* What is still outstanding right now: today, plus yesterday inside its grace. */
const routineOpenNow=()=>[...routineDay(isoOf(-1)),...routineDay(isoOf(0))]
  .filter(o=>o.status==='open'||o.status==='late');

window.tickRoutine=async(id,iso,i,who)=>{
  const c=D.chores.find(x=>x.id===id); if(!c)return;
  const slot=rslots(c)[i]??'';
  const existing=rlog(c,iso,i);
  if(existing){ await del('routineLogs',existing.id); await reload('routineLogs'); render();
    return toast(`${c.title}${slot?' · '+slot:''} — unticked`); }
  await put('routineLogs',{key:rkey(c,iso,i),choreId:id,date:iso,slot,by:who||'',at:Date.now()});
  /* Routines also land in the normal history, so "who fed the cat" is answerable
     and streaks work. Lapsed ones never do — nobody gets credit for those. */
  await put('choreHistory',{choreId:id,title:c.title+(slot?' · '+slot:''),type:c.type,by:who||'',at:Date.now(),routine:true});
  await reload('routineLogs','choreHistory'); closeSheet(); render();
  toast(`${c.title}${slot?' · '+slot:''} done${who?' by '+who:''}`);
};
window.openRoutineTick=(id,iso,i)=>{
  const c=D.chores.find(x=>x.id===id); if(!c)return;
  const slot=rslots(c)[i]??'', st=rStatus(c,iso,i), lg=rlog(c,iso,i);
  showSheet(`<h2>${esc(c.title)}${slot?` · ${esc(slot)}`:''}</h2>
    <p class="sub">${esc(fmtDate(iso+'T12:00:00'))}${st==='late'?' · yesterday, still open':''}</p>
    ${lg?`<section class="block card"><h3>Already done</h3>

        <div class="actions"><button class="btn" onclick="tickRoutine(${id},${q(iso)},${i})">Undo</button></div></section>`
      :`<section class="block card"><h3>Who did it?</h3><div class="chiprow">
        ${D.members.map(m=>`<button class="chip big" onclick="tickRoutine(${id},${q(iso)},${i},${q(m.name)})">${memberFace(m.name,false)}</button>`).join('')}

/* ===================== RECIPES =====================
   Formatting is stored as MARKDOWN-ish text, not HTML. Storing HTML would mean
   either trusting it on the way out (an injection route in an app children use)
   or sanitising it properly, which is a real library. Marking up a small,
   fixed set of characters and rendering them through esc() is both safer and
   smaller, and it keeps recipes plain enough for CSV backup to carry them.

   Videos are stored as URLs and embedded only for hosts with a known, stable
   privacy-preserving embed. Everything else stays a plain link — an <iframe>
   pointing at an arbitrary URL is a tracking surface and a layout hazard.
   ================================================== */
const VIDEO_HOSTS=[
  /* youtube-nocookie: same player, no cookie until playback */
  {re:/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{6,20})/,
   embed:id=>`https://www.youtube-nocookie.com/embed/${id}`, name:'YouTube'},
  {re:/vimeo\.com\/(\d{6,12})/, embed:id=>`https://player.vimeo.com/video/${id}`, name:'Vimeo'},
];
/* TikTok and Instagram are deliberately NOT embedded: their embeds load a
   tracking script into the page, and Instagram's blocks non-logged-in views
   anyway. A link opens the app, which is what people want on a tablet. */
function videoEmbed(url){
  if(!/^https:\/\//i.test(url||'')) return null;
  for(const h of VIDEO_HOSTS){ const m=url.match(h.re); if(m) return {src:h.embed(m[1]),name:h.name}; }
  return null;
}
const linkHost=u=>{ try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return u; } };
const safeUrl=u=>/^https?:\/\//i.test(String(u||'').trim())?String(u).trim():null;

/* **bold** *italic* # heading - bullet, plus bare URLs. Escaped FIRST, so no
   input can introduce a tag. */
function richText(src){
  const lines=String(src||'').split('\n');
  let out='',inList=false;
  const inline=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/(https?:\/\/[^\s<]+)/g,(m)=>`<a href="${m}" target="_blank" rel="noopener noreferrer nofollow">${linkHost(m)}</a>`);
  for(const raw of lines){
    const l=raw.trim();
    const bullet=/^[-*•]\s+(.*)$/.exec(l);
    if(bullet){ if(!inList){out+='<ul>';inList=true;} out+=`<li>${inline(bullet[1])}</li>`; continue; }
    if(inList){ out+='</ul>'; inList=false; }
    if(!l){ continue; }
    const head=/^(#{1,3})\s+(.*)$/.exec(l);
    if(head){ out+=`<h4>${inline(head[2])}</h4>`; continue; }
    out+=`<p>${inline(l)}</p>`;
  }
  if(inList) out+='</ul>';
  return out||'<p class="suggest">Nothing written yet.</p>';
}

}, w==='clear'?'due date removed':w==='someday'?'moved to someday':'due date set');

/* ===================== BATCH ADD =====================
   Walking round the house saying "sheets need washing every two weeks, that's
   linen maintenance". One line per thing. Only the name is required.

   Tokens after the name are CLASSIFIED, not positional — you can say them in any
   order, and anything the app doesn't recognise is surfaced rather than dropped.
   An unrecognised word is usually a category or chore type that doesn't exist
   yet, so it's offered as one to create.
   ==================================================== */
const batchTokens=line=>line.split(/[,;]|\s+[–—-]\s+/).map(t=>t.trim()).filter(Boolean);
const ciFind=(list,tok)=>list.find(x=>(x.name||x).toLowerCase()===tok.toLowerCase());

/* "+5", "in 3 days", "2 weeks", "2026-08-20" -> YYYY-MM-DD, else null */
function batchDate(tok){
  const s=tok.trim().toLowerCase();
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(?:\+|in\s+)?(\d+)\s*(d|day|days|w|week|weeks)$/);
  if(!m) return null;
  return isoPlus(+m[1]*(/^w/.test(m[2])?7:1));
}
/* ONE recurrence vocabulary, used by both batch add and CSV import. Exporters
   phrase this differently — "once", "every_n_days", "biweekly", "Every 2 Weeks"
   — and none of those are wrong, so the parser accepts them rather than making
   the user rewrite a column. Returns {recurrence,interval} or null. */
const NUMWORD={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
function parseRecurrence(tok,intervalHint){
  const s=String(tok??'').trim().toLowerCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ');
  const iv=+intervalHint>0?+intervalHint:null;
  if(!s||/^(none|once|one off|one time|onetime|single|no repeat|never|n\/a)$/.test(s))
    return {recurrence:'none',interval:iv||7};
  if(/^(daily|every day|each day|every 1 day[s]?)$/.test(s)) return {recurrence:'daily',interval:1};
  if(/^(weekly|every week|each week|every 1 week[s]?)$/.test(s)) return {recurrence:'weekly',interval:7};
  if(/^(monthly|every month|each month|every 1 month[s]?)$/.test(s)) return {recurrence:'monthly',interval:30};
  if(/^(yearly|annually|annual|every year)$/.test(s)) return {recurrence:'custom',interval:365};
  if(/^(quarterly|every quarter)$/.test(s)) return {recurrence:'custom',interval:90};
  if(/^(fortnightly|biweekly|bi weekly|every other week|every 2 weeks)$/.test(s)) return {recurrence:'custom',interval:14};
  if(/^(every other day|every 2 days)$/.test(s)) return {recurrence:'custom',interval:2};
  /* "every_n_days" / "custom" / "interval": the cadence lives in another column */
  if(/^(custom|interval|every n days|every n day)$/.test(s))
    return iv?{recurrence:'custom',interval:iv}:null;
  const m=s.match(/^(?:every )?(\d+|[a-z]+) (d|day|days|w|week|weeks|m|month|months)$/);
  if(!m) return null;
  const n=/^\d+$/.test(m[1])?+m[1]:NUMWORD[m[1]];
  if(!n) return null;
  if(/^m/.test(m[2])) return n===1?{recurrence:'monthly',interval:30}:{recurrence:'custom',interval:n*30};
  if(/^w/.test(m[2])) return n===1?{recurrence:'weekly',interval:7}:{recurrence:'custom',interval:n*7};
  return n===1?{recurrence:'daily',interval:1}:{recurrence:'custom',interval:n};
}
/* batch add: a bare "none" in a comma list is noise, not a cadence */
function batchRecur(tok){
  const s=String(tok??'').trim().toLowerCase();
  if(!s||/^(none|no|n\/a)$/.test(s)) return null;
  const r=parseRecurrence(s);
  return r&&r.recurrence==='none'&&!/^(once|one off|one time|onetime|single|never|no repeat)$/.test(s.replace(/[_-]+/g,' '))?null:r;
}
/* "20 min", "1.5 hours", "90m" -> minutes. Deliberately requires a unit, so a
   bare number stays a possible date or interval rather than being guessed at. */
function batchMinutes(tok){
  const m=String(tok??'').trim().toLowerCase().match(/^(\d+(?:\.\d+)?)\s*(m|min|mins|minute|minutes|h|hr|hrs|hour|hours)$/);
  if(!m) return null;
  const n=parseFloat(m[1]); if(!(n>0)) return null;
  return Math.round(/^h/.test(m[2])?n*60:n);
}
function batchLocation(tok){
  const hit=ciFind(LOCS(),tok); if(hit) return hit.name;
  const s=tok.toLowerCase();
  if(/^fridge$/.test(s)) return 'Fridge shelf';
  if(/^(crisper|veg drawer)$/.test(s)) return 'Crisper drawer';
  if(/^door$/.test(s)) return 'Fridge door';
  return LOCS().find(l=>l.name.toLowerCase().includes(s)&&s.length>3)?.name||null;
}

function batchParse(kind,text){
  return text.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const toks=batchTokens(line);
    const name=toks.shift();
    const r={line,name,unknown:[]};
    for(const t of toks){
      if(kind==='food'){
        const loc=batchLocation(t);       if(loc&&!r.location){r.location=loc;continue}
        const cat=ciFind(D.categories,t); if(cat&&!r.category){r.category=cat.name;continue}
        const con=ciFind(CONTAINERS,t);   if(con&&!r.container){r.container=con;continue}
        const d=batchDate(t);             if(d&&!r.eatBy){r.eatBy=d;continue}
      }else{
        const mins=batchMinutes(t);       if(mins&&!r.minutes){r.minutes=mins;continue}
        const ar=ciFind(D.areas,t);       if(ar&&!r.area){r.area=ar.name;continue}
        const rec=batchRecur(t);          if(rec&&!r.recurrence){Object.assign(r,rec);continue}
        const who=ciFind(D.members,t);    if(who){(r.assignees??=[]).push(who.name);continue}
        const ty=ciFind(D.choreTypes,t);  if(ty&&!r.type){r.type=ty.name;continue}
        const d=batchDate(t);             if(d&&!r.dueBy){r.dueBy=d;continue}
        if(/^(someday|sometime|no rush|eventually)$/i.test(t)&&!r.dueBy){r.dueBy=SOMEDAY;continue}
        if(/^routine$/i.test(t)){r.routine=true;continue}
        if(/^(priority|urgent)$/i.test(t)){r.priority=true;continue}
      }
      r.unknown.push(t);
    }
    /* the first unrecognised word is almost always a category / chore type that
       doesn't exist yet — propose it rather than discarding it */
    if(r.unknown.length) r.propose=r.unknown[0];
    /* food has nowhere to keep loose words; chores have a notes field, so use it */
    if(kind==='chores'&&r.unknown.length>1) r.notes=r.unknown.slice(1).join(', ');
    return r;
  });
}
const batchGaps=(kind,r)=>kind==='food'
  ? ['category','location','eat-by'].filter((_,i)=>![r.category,r.location,r.eatBy][i])
  : ['type','repeat','due date','who','time'].filter((_,i)=>![r.type,r.recurrence,r.dueBy,r.assignees?.length,r.minutes][i]);

window.openBatch=k=>{batch={kind:k,text:'',parsed:null,makeVocab:true};draft=null;choreDraft=null;
  if(k==='food') foodSub='batch'; render()};
window.closeBatch=()=>{batch=null;foodSub='list';render()};
window.batchText=v=>{batch.text=v};
window.batchPreview=()=>{
  if(!batch.text.trim()) return toast('Type at least one line');
  batch.parsed=batchParse(batch.kind,batch.text); render();
};
window.batchBack=()=>{batch.parsed=null;render()};
window.batchToggleVocab=()=>{batch.makeVocab=!batch.makeVocab;render()};

function batchNewVocab(){
  if(!batch.parsed) return [];
  const known=batch.kind==='food'?D.categories:D.choreTypes;
  const seen=new Set(known.map(x=>x.name.toLowerCase()));
  const out=[];
  for(const r of batch.parsed){
    if(!r.propose) continue;
    const k=r.propose.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); out.push(r.propose);
  }
  return out;
}
window.batchCommit=async()=>{
  const kind=batch.kind, rows=batch.parsed, fresh=batchNewVocab();
  const store=kind==='food'?'categories':'choreTypes';
  const cap=kind==='food'?CAP.cats:CAP.choreTypes;
  let made=0;
  if(batch.makeVocab){
    for(const name of fresh){
      if(D[store].length+made>=cap) break;      /* caps are caps */
      await put(store,{name}); made++;
    }
    await reload(store);
  }
  const live=new Set(D[store].map(x=>x.name.toLowerCase()));
  const now=Date.now();
  for(const r of rows){
    const proposed=r.propose&&live.has(r.propose.toLowerCase())?
      D[store].find(x=>x.name.toLowerCase()===r.propose.toLowerCase()).name:null;
    if(kind==='food'){
      await put('items',{name:r.name,location:r.location||null,container:r.container||null,
        category:r.category||proposed||null,libId:null,eatBy:r.eatBy||null,created:now,modified:now});
    }else{
      await put('chores',{title:r.name,type:r.type||proposed||null,area:r.area||null,minutes:r.minutes||null,
        routine:!!r.routine,rdays:[],slots:[],ranchor:r.routine?todayISO():undefined,
        recurrence:r.recurrence||'none',interval:r.interval||7,checkIn:'',dueBy:r.dueBy||'',
        assignees:r.assignees||[],priority:!!r.priority,needsHelp:false,
        notes:r.notes||'',created:now,modified:now});
    }
  }
  await reload(kind==='food'?'items':'chores');
  const gapped=rows.filter(r=>batchGaps(kind,{...r,...(r.propose&&batch.makeVocab?{[kind==='food'?'category':'type']:r.propose}:{})}).length).length;
  batch=null; foodSub='list';
  toast(`Added ${rows.length}${made?` · ${made} new ${kind==='food'?'categories':'types'}`:''}${gapped?` · ${gapped} need details`:''}`);
  render();
};

function viewBatch(){
  const kind=batch.kind, food=kind==='food';
  const back=`<div class="subbar">
    <button class="chip" onclick="closeBatch()">← Back</button>

  if(!batch.parsed){
    const eg=food
      ? `Milk, fridge door, Dairy, 5 days\nSourdough, counter\nFrozen peas, freezer, Produce`
      : `Wash sheets, every two weeks, 45 min, Bedrooms\nBins out, weekly, 10 min, Alex\nDescale kettle`;
    return back+`<section class="block card"><h3>One per line</h3>
      <p class="suggest">Start with the name. After that add anything you know —
      ${food?'a place, a category, how long it keeps':'how often, who does it, when it is due'} —
      separated by commas, in any order. Everything except the name is optional.</p>
      <textarea class="field" rows="9" style="min-height:180px;font-family:inherit"
        placeholder="${esc(eg)}" oninput="batchText(this.value)">${esc(batch.text)}</textarea>

        <button class="btn" onclick="batchPreview()">Check the list</button>
        <button class="btn ghost" onclick="closeBatch()">Cancel</button></div></section>
      <section class="block card"><h3>What it understands</h3>
      <p class="suggest">${food
        ? 'Places (fridge, freezer, pantry, counter, cabinet, basement, crisper, door) · your categories · containers · "5 days", "2 weeks", or a date like 2026-08-20.'
        : '"every two weeks", "weekly", "fortnightly", "every 3 days" · household names · your chore types · parts of the house · "20 min" or "2 hours" · "3 days" or 2026-08-20 for a due date · the word "priority".'}</p>
      <p class="suggest">Anything else is treated as a ${food?'category':'chore type'} you have not made yet,
      and you will be asked before it is created. Nothing is written until you confirm.</p></section>`;
  }
  const fresh=batchNewVocab();
  const rows=batch.parsed.map(r=>{
    const bits=food
      ? [r.category,r.location,r.container,r.eatBy?'eat by '+r.eatBy:null]
      : [r.type,r.area,r.minutes?minsLabel(r.minutes):null,
         r.recurrence?recurLabel({recurrence:r.recurrence,interval:r.interval}):null,
         r.dueBy?'due '+r.dueBy:null,(r.assignees||[]).join(' & ')||null,r.priority?'priority':null];
    const known=bits.filter(Boolean).map(b=>`<span class="chip sm">${esc(b)}</span>`).join('');
    const prop=r.propose?`<span class="chip sm new">${esc(r.propose)} — new ${food?'category':'type'}</span>`:'';
    const gaps=batchGaps(kind,{...r,...(r.propose&&batch.makeVocab?{[food?'category':'type']:r.propose}:{})});
    const miss=gaps.length?`<span class="chip sm gap">no ${gaps.join(', no ')}</span>`:'';
    const note=r.notes?`<span class="chip sm">note: ${esc(r.notes)}</span>`:'';
    return `<div class="brow"><b>${esc(r.name)}</b><div class="bchips">${known}${prop}${note}${miss}</div></div>`;
  }).join('');
  const vocab=fresh.length?`<section class="block card"><h3>${fresh.length} new ${food?'category':'chore type'}${fresh.length===1?'':'s'}</h3>
      <p class="suggest">These are not in your list yet: <b>${fresh.map(esc).join(', ')}</b>.</p>
      <div class="chiprow">
        <button class="chip ${batch.makeVocab?'on':''}" onclick="batchToggleVocab()">Create ${fresh.length===1?'it':'them'} and assign</button>
        <button class="chip ${batch.makeVocab?'':'on'}" onclick="batchToggleVocab()">Leave blank and flag</button></div></section>`:'';
  const gapCount=batch.parsed.filter(r=>batchGaps(kind,{...r,...(r.propose&&batch.makeVocab?{[food?'category':'type']:r.propose}:{})}).length).length;
  return back+vocab+`<section class="block card"><h3>${batch.parsed.length} to add</h3>
      ${gapCount?`<p class="suggest">${gapCount} still ${gapCount===1?'has':'have'} blanks. That is fine —
        they are added anyway and show a <b>needs details</b> tag you can filter for later.</p>`:''}
      <div class="btable">${rows}</div>
      <div class="actions" style="margin-top:12px">
        <button class="btn" onclick="batchCommit()">Add ${batch.parsed.length}</button>
        <button class="btn ghost" onclick="batchBack()">Edit the list</button></div></section>`;
}

const recurLabel=c=>c.recurrence==='custom'?`every ${c.interval} days`:({daily:'daily',weekly:'weekly',monthly:'monthly'}[c.recurrence]||'');
function viewChores(){
  if(batch&&batch.kind==='chores') return viewBatch();
  if(choreDraft) return viewChoreForm();
  const nOpen=routineOpenNow().length;
  const sub=`<div class="subbar">
    <button class="chip ${choreView==='tasks'?'on':''}" onclick="setChoreView('tasks')">What's next</button>
    <button class="chip ${choreView==='routines'?'on':''}" onclick="setChoreView('routines')">Routines${nOpen?` · ${nOpen}`:''}</button>
    <button class="chip" onclick="newChore()">+ Add chore</button>
    <button class="chip" onclick="openBatch('chores')">≡ Batch add</button>
    <button class="chip" onclick="showHistory()">History</button>
  </div>`;
  if(choreView==='routines') return sub+viewRoutines();
  if(D.chores.length===0) return sub+`<div class="empty card"><p><strong>No chores yet.</strong></p>
    <p>Tap <b>+ Add chore</b> to set one up.</p></div>`;
  const types=[...new Set(D.chores.map(c=>c.type).filter(Boolean))];
  const whos=[...new Set(D.chores.flatMap(c=>c.assignees||[]))];
  const nGap=D.chores.filter(c=>choreGaps(c).length).length;
  const areas=D.areas.map(a=>a.name).filter(a=>D.chores.some(c=>c.area===a));
  /* Four short rows, each asking a plain question, rather than one long strip of
     unlabelled chips. The order is the order people actually decide in: time
     first, because that is the real constraint on a Saturday morning. */
  const row=(label,chips)=>chips?`<div class="filterrow"><span class="flabel">${label}</span>
    <div class="subbar">${chips}</div></div>`:'';
  const inner=
    row("How much time do you have?", TIMEBUCKETS.map(([k,l])=>
      `<button class="chip ${choreFilterTime===k?'on':''}" onclick="filterTime('${k}')">${l}</button>`).join(''))
   +row("What matters most?",
      `<button class="chip ${choreFilterPri?'on':''}" onclick="filterPri()">Priority only</button>`
     +`<button class="chip ${choreFilterDue==='overdue'?'on':''}" onclick="filterDue('overdue')">Overdue</button>`
     +`<button class="chip ${choreFilterDue==='today'?'on':''}" onclick="filterDue('today')">Due today</button>`
     +`<button class="chip ${choreFilterDue==='week'?'on':''}" onclick="filterDue('week')">Next 7 days</button>`
     +`<button class="chip ${choreFilterDue==='none'?'on':''}" onclick="filterDue('none')">No due date</button>`
     +`<button class="chip ${choreFilterDue==='someday'?'on':''}" onclick="filterDue('someday')">Someday</button>`)
   +row("Who's available?", whos.map(w=>
      `<button class="chip ${choreFilterWho===w?'on':''} ${memberByName(w)?.avatar?'hasface':''}" onclick="filterWho(${q(w)})">${memberFace(w,true)}</button>`).join(''))
   +row("Which part of the house?", areas.map(a=>
      `<button class="chip ${choreFilterArea===a?'on':''}" onclick="filterArea(${q(a)})">${esc(a)}</button>`).join(''))
   +row("What kind of job?", types.map(t=>
      `<button class="chip ${choreFilterType===t?'on':''}" onclick="filterType(${q(t)})">${esc(t)}</button>`).join(''))
   +row("", (nGap?`<button class="chip ${choreGapsOnly?'on':''}" onclick="toggleChoreGaps()">Needs details · ${nGap}</button>`:'')
     +(anyChoreFilter()?`<button class="chip" onclick="clearFilters()">Clear all filters</button>`:''));

  /* Collapsed by default: five labelled rows of chips is a wall between someone
     and their chore list. The summary line has to name the ACTIVE filters, or a
     closed accordion silently hides why the list looks short. */
  const active=[
    choreFilterTime&&TIMEBUCKETS.find(([k])=>k===choreFilterTime)[1],
    choreFilterPri&&'priority',
    choreFilterDue&&({overdue:'overdue',today:'due today',week:'next 7 days',none:'no due date',someday:'someday'})[choreFilterDue],
    choreFilterWho, choreFilterArea, choreFilterType,
    choreGapsOnly&&'needs details',
  ].filter(Boolean);
  const summary=active.length?active.join(' · '):'everything';
  const filters=`<div class="bulk ${filtersOpen?'open':''}">
    <button class="bulkhead" onclick="toggleFilters()" aria-expanded="${filtersOpen}">
      What to do? <span class="headnote">${esc(summary)}</span>
      <span class="caret">${filtersOpen?'▴':'▾'}</span></button>
    ${filtersOpen?`<div class="bulkbody">${inner}</div>`:''}</div>`;

  let list=D.chores.filter(choreMatches);
  /* Three tiers: dated (by urgency), then undated, then someday. Someday is
     always last even when marked priority — "priority someday" means "when we
     get to it, do this one first", not "do it now". */
  const tier=c=>isSomeday(c)?2:(hasRealDate(c.dueBy)?0:1);
  list.sort((a,b)=>
    tier(a)-tier(b)
    || (!!b.priority-!!a.priority)
    || ((daysUntil(a.dueBy)??9e9)-(daysUntil(b.dueBy)??9e9))
    || String(a.title||'').localeCompare(String(b.title||''))
  );
  const body=list.length?list.map(choreCard).join('')
    :`<div class="empty card"><p><strong>Nothing matches.</strong></p>
       <p>Try widening one of the filters above — most often it is the time bucket,
       since chores with no estimate are hidden by it.</p></div>`;
  return sub+filters+bulkBar(list)+body;
}
const anyChoreFilter=()=>!!(choreFilterType||choreFilterWho||choreFilterTime||choreFilterArea||choreFilterDue||choreFilterPri||choreGapsOnly);
function choreMatches(c){
  /* The whole point of a routine is that it is NOT on the task list. */
  if(isRoutine(c)) return false;
  if(choreFilterType&&c.type!==choreFilterType) return false;
  if(choreFilterWho&&!(c.assignees||[]).includes(choreFilterWho)) return false;
  if(choreFilterArea&&c.area!==choreFilterArea) return false;
  if(choreFilterPri&&!c.priority) return false;
  if(choreGapsOnly&&!choreGaps(c).length) return false;
  /* A chore with no estimate is not "quick" — it is unknown. Hiding it from a
     time filter is honest; silently calling it 10 minutes would not be. */
  if(choreFilterTime&&timeBucket(c.minutes)!==choreFilterTime) return false;
  if(choreFilterDue){
    const d=daysUntil(c.dueBy);
    if(choreFilterDue==='someday'&&!isSomeday(c)) return false;
    if(choreFilterDue!=='someday'&&isSomeday(c)) return false;   /* never in a dated bucket */
    if(choreFilterDue==='none'&&c.dueBy) return false;
    if(choreFilterDue==='overdue'&&!(d!==null&&d<0)) return false;
    if(choreFilterDue==='today'&&d!==0) return false;
    if(choreFilterDue==='week'&&!(d!==null&&d>=0&&d<=7)) return false;
  }
  return true;
}

    ${c.recurrence!=='none'?`<p class="suggest">This repeats ${esc(recurLabel(c))} — changing the date

window.setDue=async(id,v)=>{
  const c=D.chores.find(x=>x.id===id); if(!c)return;
  if(v&&v!==SOMEDAY&&!/^\d{4}-\d{2}-\d{2}$/.test(v)) return toast('That date was not understood');
  c.dueBy=v||''; c.modified=Date.now();
  await put('chores',c); await reload('chores');
  closeSheet(); render();
  toast(`${c.title} — ${dueLabel(c)}`);
};
window.toggleFlag=async(id,k)=>{const c=D.chores.find(x=>x.id===id);c[k]=!c[k];await put('chores',c);openChore(id);render()};
window.completeChore=async(id,who)=>{
  const c=D.chores.find(x=>x.id===id); if(!c)return;
  /* Routines are ticked per occurrence; completing one wholesale would delete a
     rhythm the household still needs. */
  if(isRoutine(c)) return openRoutineTick(id,todayISO(),0);
  await put('choreHistory',{choreId:id,title:c.title,type:c.type,by:who,at:Date.now()});
  if(c.recurrence==='none'){
    await del('chores',id);
    toast(`${c.title} done${who?' by '+who:''}`);
  }else{
    const from=todayISO();
    const nextDue=advance(c.dueBy||from,c.recurrence,c.interval,from);
    if(c.checkIn){
      const gap=Math.round((new Date(c.dueBy+'T12:00:00')-new Date(c.checkIn+'T12:00:00'))/DAY);
      const ci=new Date(nextDue+'T12:00:00'); ci.setDate(ci.getDate()-(gap||0));
      c.checkIn=ci.toISOString().slice(0,10);
    }
    c.dueBy=nextDue; c.needsHelp=false; c.modified=Date.now();
    await put('chores',c);
    toast(`${c.title} done — next ${fmtDate(nextDue+'T12:00:00')}`);
  }
  await reload('chores','choreHistory'); closeSheet(); render();
};
window.deleteChore=async id=>{
  const c=D.chores.find(x=>x.id===id);
  closeSheet();
  if(await confirmBox(`Delete <b>${esc(c.title)}</b>? Its completion history is kept.`,'Delete','Cancel')){
    await del('chores',id); await reload('chores'); toast('Chore deleted'); render();
  }
};
window.showHistory=()=>{
  const h=[...D.choreHistory].sort((a,b)=>b.at-a.at).slice(0,60);
  showSheet(`<h2>Completed chores</h2><p class="sub">Most recent 60. Kept even if the chore is deleted.</p>

};

/* ===================== HABITS ===================== */
const dayKey=ts=>{const d=new Date(ts);d.setHours(12,0,0,0);return d.toISOString().slice(0,10)};
function last7(){const out=[];for(let i=6;i>=0;i--)out.push(dayKey(Date.now()-i*DAY));return out}
function streakFor(member,habit){
  const days=new Set(D.habitLogs.filter(l=>l.member===member&&l.habit===habit).map(l=>l.day));
  let n=0,cur=new Date();cur.setHours(12,0,0,0);
  if(!days.has(cur.toISOString().slice(0,10))) cur.setDate(cur.getDate()-1); /* today not logged yet is ok */
  while(days.has(cur.toISOString().slice(0,10))){n++;cur.setDate(cur.getDate()-1)}
  return n;
}
function habitDays(member,habit){
  return [...new Set(D.habitLogs.filter(l=>l.member===member&&l.habit===habit).map(l=>l.day))].sort();
}
/* maximal consecutive-day runs, so back-dated entries join runs automatically */
function runsOf(days){
  const runs=[]; let run=0,prev=null;
  for(const d of days){
    const gap=prev?Math.round((new Date(d+'T12:00:00')-new Date(prev+'T12:00:00'))/DAY):null;
    run=(gap===1)?run+1:1;
    if(gap===1) runs[runs.length-1]=run; else runs.push(1);
    prev=d;
  }
  return runs;
}
/* every completed STREAK_GOAL inside any run earns one prize — derived from the logs,
   so editing history re-counts honestly instead of trusting a stored tally */
function bestStreak(member,habit){
  const runs=runsOf(habitDays(member,habit));
  return runs.length?Math.max(...runs):0;
}
function milestonesFor(member){
  const habits=[...new Set(D.habitLogs.filter(l=>l.member===member).map(l=>l.habit))];
  return habits.reduce((sum,hb)=>sum+runsOf(habitDays(member,hb)).reduce((s,r)=>s+Math.floor(r/STREAK_GOAL),0),0);
}
const prizesFor=member=>D.prizes.filter(p=>p.to===member).sort((a,b)=>a.created-b.created);
function prizeStatus(member){
  const q=prizesFor(member), earned=milestonesFor(member);
  const claimed=q.filter((p,i)=>i<earned);
  return {queue:q,earned,unlocked:claimed.length,locked:q.length-claimed.length};
}
function viewHabits(){
  if(D.members.length===0) return `<div class="empty card"><p><strong>No household names yet.</strong></p>
    <p>Add names in <b>Setup</b> — habits are logged per person.</p></div>`;
  const who=habitMember||D.members[0].name;
  const day=habitDate||dayKey(Date.now());
  const isToday=day===dayKey(Date.now());
  const logged=hb=>D.habitLogs.some(l=>l.member===who&&l.habit===hb&&l.day===day);
  const names=`<div class="subbar">${D.members.map(m=>
    `<button class="chip big ${who===m.name?'on':''} ${m.avatar?'hasface':''}" onclick="setWho(${q(m.name)})">${memberFace(m.name,true)}</button>`).join('')}</div>`;
  const dayLabel=isToday?'today':(day===dayKey(Date.now()-DAY)?'yesterday'
    :new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'}));
  const dates=`<div class="subbar">
    <button class="chip ${isToday?'on':''}" onclick="setHabitDate(0)">Today</button>
    <button class="chip ${day===dayKey(Date.now()-DAY)?'on':''}" onclick="setHabitDate(-1)">Yesterday</button>
    <input class="field" style="width:auto;min-height:44px;padding:6px 10px" type="date" value="${day}"
      max="${dayKey(Date.now())}" onchange="setHabitDay(this.value)">
  </div>`;
  const grid=`<section class="block card"><h3>Tap what ${esc(who)} did ${esc(dayLabel)}</h3>
    ${dates}
    <div class="grid">${D.habits.map(hb=>

    <p class="suggest">Tapping a checked habit removes that day's entry. Pick any past date to fill in or fix history.</p></section>`;
  const streaks=`<section class="block card"><h3>${esc(who)}'s streaks</h3>
    <div style="margin:0 -16px">${D.habits.map(hb=>{
      const s=streakFor(who,hb.name), best=bestStreak(who,hb.name);
      const toGo=s>0?STREAK_GOAL-(s%STREAK_GOAL||STREAK_GOAL):STREAK_GOAL;
      return `<div class="streak"><span class="nm">${esc(hb.name)}</span>
        <span class="best">${s>0&&toGo<STREAK_GOAL?toGo+' to a prize':''}</span>

    }).join('')}</div>${goalBanner(who)}</section>`;
  return names+grid+streaks+graphBlock();
}
function goalBanner(who){
  const st=prizeStatus(who);
  if(st.unlocked>0) return `<div class="goal">
    <span class="big">🎁</span><span class="txt"><b>${st.unlocked} prize${st.unlocked===1?'':'s'} unlocked for ${esc(who)}!</b>

  if(st.locked>0){

    const toGo=best>0?STREAK_GOAL-(best%STREAK_GOAL||STREAK_GOAL):STREAK_GOAL;
    return `<div class="goal"><span class="big">🎁</span><span class="txt">
      <b>${st.locked} prize${st.locked===1?'':'s'} waiting for ${esc(who)}</b>
      <span>${best>0?`${toGo} more day${toGo===1?'':'s'} in a row on any habit unlocks the next one.`
        :`Keep any habit going ${STREAK_GOAL} days in a row to unlock one.`}</span></span></div>`;
  }
  return `<div class="goal"><span class="big">🔥</span><span class="txt">
    <b>${STREAK_GOAL} days in a row earns a prize</b>

}

function graphBlock(){
  const days=last7();
  const series = habitGraphMode==='habit'
    ? D.habits.map(hb=>({label:hb.name,vals:days.map(d=>D.habitLogs.filter(l=>l.habit===hb.name&&l.day===d).length)}))
    : D.members.map(m=>({label:m.name,vals:days.map(d=>D.habitLogs.filter(l=>l.member===m.name&&l.day===d).length)}));
  const active=series.filter(s=>s.vals.some(v=>v>0));
  const max=Math.max(1,...active.flatMap(s=>s.vals));
  const W=660,H=180,PL=28,PB=26;
  const x=i=>PL+i*((W-PL-10)/6), y=v=>H-PB-(v/max)*(H-PB-14);
  const gridlines=[0,Math.ceil(max/2),max].map(v=>
    `<line x1="${PL}" y1="${y(v)}" x2="${W-10}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
     <text x="4" y="${y(v)+4}" fill="var(--muted)" font-size="11">${v}</text>`).join('');
  const labels=days.map((d,i)=>`<text x="${x(i)}" y="${H-6}" fill="var(--muted)" font-size="11" text-anchor="middle">${
    new Date(d+'T12:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</text>`).join('');
  const lines=active.map((s,si)=>{
    const col=SERIES[si%SERIES.length];
    const pts=s.vals.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const dots=s.vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${col}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');
  const legend=active.map((s,si)=>`<span><i style="background:${SERIES[si%SERIES.length]}"></i>${esc(s.label)}</span>`).join('');
  return `<section class="block card"><h3>Last 7 days</h3>
    <div class="chiprow" style="margin-bottom:10px">
      <button class="chip ${habitGraphMode==='habit'?'on':''}" onclick="setGraph('habit')">By habit</button>
      <button class="chip ${habitGraphMode==='member'?'on':''}" onclick="setGraph('member')">By person</button>
    </div>
    ${active.length?`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Habit logs over the last 7 days">
      ${gridlines}${labels}${lines}</svg><div class="legend">${legend}</div>`
      :`<p style="color:var(--muted)">Nothing logged in the last 7 days yet.</p>`}
  </section>`;
}

/* ---- drawing: pen, text tool, sizes, fonts, undo ---- */
const INKS=['#ffffff','#a9dcf5','#5fd08a','#f0a35e','#e8646a','#1a1d23'];
const INK_NAMES={'#ffffff':'white','#a9dcf5':'blue','#5fd08a':'green','#f0a35e':'orange','#e8646a':'red','#1a1d23':'black'};
const FONTSIZES=[['S',22],['M',34],['L',52],['XL',76]];
const FONTS=[['Sans','system-ui,sans-serif'],['Serif','Georgia,serif'],['Marker','"Comic Sans MS",cursive']];
let inkColor=INKS[0], drawTool='pen', fontSize=34, fontFam=FONTS[0][1], undoStack=[];
function snapshot(cv){
  const ctx=cv.getContext('2d');
  undoStack.push(ctx.getImageData(0,0,cv.width,cv.height));
  if(undoStack.length>8) undoStack.shift();
}
window.undoDraw=()=>{
  const cv=$('#draw'); if(!cv||!undoStack.length) return toast('Nothing to undo');
  cv.getContext('2d').putImageData(undoStack.pop(),0,0);
};
window.setTool=t=>{drawTool=t;paintTools()};
window.setInk=c=>{inkColor=c;paintTools()};
window.setSize=n=>{fontSize=n;paintTools()};
window.setFont=f=>{fontFam=f;paintTools()};
function paintTools(){
  const tools=$('#tools'); if(!tools) return;
  tools.innerHTML=[['pen','✏️ Pen'],['text','🅰 Text']].map(([k,l])=>
    `<button class="chip ${drawTool===k?'on':''}" onclick="setTool('${k}')">${l}</button>`).join('');
  $('#inks').innerHTML=INKS.map(c=>
    `<button class="ink ${c===inkColor?'on':''}" style="background:${c}" aria-label="${INK_NAMES[c]||'ink'} ink" aria-pressed="${c===inkColor}" onclick="setInk('${c}')"></button>`).join('');
  $('#textTools').innerHTML = drawTool!=='text' ? '' :
    `<input class="field" id="drawText" placeholder="Type, then tap the canvas to place it" style="margin-top:10px">
     <div class="chiprow" style="margin-top:8px">${FONTSIZES.map(([l,n])=>
       `<button class="chip ${fontSize===n?'on':''}" onclick="setSize(${n})">${l}</button>`).join('')}</div>
     <div class="chiprow" style="margin-top:8px">${FONTS.map(([l,f])=>
       `<button class="chip ${fontFam===f?'on':''}" style="font-family:${f}" onclick="setFont(${q(f)})">${l}</button>`).join('')}</div>`;
}
function initComposer(){
  if(noteMode!=='draw') return;
  const cv=$('#draw'); if(!cv) return;
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#20252e'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=5;
  undoStack=[]; paintTools();
  let down=false,px=0,py=0;
  const pos=e=>{const r=cv.getBoundingClientRect();
    return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{
    const [x,y]=pos(e);
    if(drawTool==='text'){
      const txt=$('#drawText')?.value;
      if(!txt||!txt.trim()) return toast('Type the words first, then tap');
      snapshot(cv);
      ctx.fillStyle=inkColor; ctx.font=`${fontSize}px ${fontFam}`; ctx.textBaseline='middle';
      ctx.fillText(txt,x,y);
      return;
    }
    snapshot(cv); down=true; [px,py]=[x,y]; cv.setPointerCapture(e.pointerId);
  };
  cv.onpointermove=e=>{if(!down)return;const [x,y]=pos(e);

  cv.onpointerup=cv.onpointercancel=()=>{down=false};
}

/* ---- audio ---- */
async function startRec(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const rec=new MediaRecorder(stream); const chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      pendingBlob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});
      const ap=$('#audioPreview');
      if(ap) ap.innerHTML=`<audio controls src="${URL.createObjectURL(pendingBlob)}"></audio>
        <p class="suggest">${bytes(pendingBlob.size)} — press <b>Add to note</b> to attach it.</p>`;
      const ui=$('#recUI'); if(ui) ui.innerHTML=`<button class="btn primary" onclick="toggleRec()">Record again</button>`;
    };
    rec.start(); recState={rec,stream};
    $('#recUI').innerHTML=`<span class="dot"></span><button class="btn danger" onclick="toggleRec()">Stop</button>`;
  }catch(err){ toast('Microphone unavailable: '+(err.name==='NotAllowedError'?'permission denied':'not found')); }
}
function stopRecIfAny(){ if(recState){try{recState.rec.stop()}catch(e){} recState=null} }
window.toggleRec=()=>{ if(recState){recState.rec.stop();recState=null} else startRec(); };

function parseLibrary(text,vocab){
